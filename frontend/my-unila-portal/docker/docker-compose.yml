version: '3.8'

services:
  # Frontend Next.js Application
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: my-unila-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-My Unila Portal}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    networks:
      - my-unila-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development mode (optional)
  frontend-dev:
    image: node:20-alpine
    container_name: my-unila-portal-frontend-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-My Unila Portal}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    networks:
      - my-unila-network
    profiles:
      - dev

networks:
  my-unila-network:
    driver: bridge
