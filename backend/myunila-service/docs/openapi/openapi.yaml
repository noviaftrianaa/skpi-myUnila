openapi: 3.1.0
info:
  title: MyUnila Integrator Service API
  description: |
    API untuk sinkronisasi data dari sistem existing (SIKEP, Radius, ManAkses) ke MyUnila/OneData.

    ## Fitur Utama
    - Sinkronisasi data pegawai dari SIKEP
    - Sinkronisasi data pengguna dari Radius SSO
    - Sinkronisasi unit organisasi dari ManAkses
    - Manajemen scheduler untuk sinkronisasi otomatis
    - Monitoring real-time proses sinkronisasi

    ## Authentication
    Sebagian besar endpoint memerlukan JWT Bearer token yang divalidasi melalui Kong Gateway.
  version: 1.0.0
  contact:
    name: Tim MyUnila
    email: myunila@unila.ac.id
    url: https://my.unila.ac.id
  license:
    name: Internal Use Only
    url: https://unila.ac.id

servers:
  - url: http://localhost:8086
    description: Local Development
  - url: http://localhost:9800/myunila
    description: Via Kong Gateway (Local)
  - url: https://api.unila.ac.id/myunila
    description: Production

tags:
  - name: Health
    description: Health check endpoint
  - name: SIKEP Pegawai
    description: Sinkronisasi data pegawai dari SIKEP Unila
  - name: SIKEP Referensi
    description: Data referensi dari SIKEP
  - name: Radius
    description: Sinkronisasi data pengguna dari Radius SSO
  - name: ManAkses Unit Organisasi
    description: Sinkronisasi unit organisasi dari ManAkses
  - name: Scheduler
    description: Manajemen jadwal sinkronisasi otomatis
  - name: Logger
    description: Log sinkronisasi
  - name: Monitoring
    description: Monitoring proses sinkronisasi real-time
  - name: API Config
    description: Konfigurasi API eksternal

paths:
  /health:
    $ref: './paths/health.yaml#/health'

  # SIKEP Pegawai
  /api/v1/sikep/pegawai:
    $ref: './paths/sikep-pegawai.yaml#/list'
  /api/v1/sikep/pegawai/stats:
    $ref: './paths/sikep-pegawai.yaml#/stats'
  /api/v1/sikep/pegawai/sync:
    $ref: './paths/sikep-pegawai.yaml#/sync'
  /api/v1/sikep/pegawai/{id}:
    $ref: './paths/sikep-pegawai.yaml#/detail'

  # SIKEP Referensi
  /api/v1/sikep/referensi:
    $ref: './paths/sikep-referensi.yaml#/list'
  /api/v1/sikep/referensi/metadata:
    $ref: './paths/sikep-referensi.yaml#/metadata'

  # Radius
  /api/v1/radius/pengguna:
    $ref: './paths/radius.yaml#/list'
  /api/v1/radius/pengguna/stats:
    $ref: './paths/radius.yaml#/stats'
  /api/v1/radius/sync:
    $ref: './paths/radius.yaml#/sync'
  /api/v1/radius/stats:
    $ref: './paths/radius.yaml#/overall-stats'

  # ManAkses Unit Organisasi
  /api/v1/manakses/unit-organisasi:
    $ref: './paths/unit-organisasi.yaml#/list'
  /api/v1/manakses/unit-organisasi/stats:
    $ref: './paths/unit-organisasi.yaml#/stats'
  /api/v1/manakses/unit-organisasi/sync:
    $ref: './paths/unit-organisasi.yaml#/sync'
  /api/v1/manakses/unit-organisasi/comparison:
    $ref: './paths/unit-organisasi.yaml#/comparison'

  # Scheduler
  /api/v1/schedules:
    $ref: './paths/scheduler.yaml#/list'
  /api/v1/schedules/{id}:
    $ref: './paths/scheduler.yaml#/detail'

  # Logger
  /api/v1/logger:
    $ref: './paths/logger.yaml#/list'

  # Monitoring
  /api/v1/monitoring:
    $ref: './paths/monitoring.yaml#/active'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token dari Kong Gateway

  schemas:
    $ref: './schemas/_index.yaml'

  responses:
    $ref: './responses/_index.yaml'

security:
  - bearerAuth: []
