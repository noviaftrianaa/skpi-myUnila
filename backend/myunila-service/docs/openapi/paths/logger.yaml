list:
  get:
    tags:
      - Logger
    summary: Get Sync Logs
    description: Mengambil daftar log sinkronisasi
    operationId: getSyncLogs
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: type
        in: query
        description: Filter berdasarkan tipe sinkronisasi
        schema:
          type: string
          enum:
            - sikep_pegawai
            - radius
            - unit_organisasi
      - name: status
        in: query
        description: Filter berdasarkan status
        schema:
          type: string
          enum:
            - success
            - failed
            - running
      - name: start_date
        in: query
        description: Filter tanggal mulai (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Filter tanggal akhir (YYYY-MM-DD)
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Berhasil mengambil log sinkronisasi
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../schemas/logger.yaml#/SyncLog'
                pagination:
                  $ref: '../schemas/common.yaml#/Pagination'
