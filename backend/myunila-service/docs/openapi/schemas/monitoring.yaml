ActiveProcess:
  type: object
  properties:
    id:
      type: string
      example: "sync-sikep-1704067200"
    type:
      type: string
      enum:
        - sikep_pegawai
        - radius
        - unit_organisasi
      example: sikep_pegawai
    status:
      type: string
      example: running
    progress:
      type: object
      properties:
        current:
          type: integer
          example: 250
        total:
          type: integer
          example: 500
        percentage:
          type: number
          format: float
          example: 50.0
    started_at:
      type: string
      format: date-time
    elapsed_seconds:
      type: number
      format: float
      example: 60.5
