# version: '3.8'  # Deprecated in newer docker-compose

services:
  # ========================================
  # Infrastructure Services (No Database)
  # ========================================

  # Redis for Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: myunila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myunila-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

