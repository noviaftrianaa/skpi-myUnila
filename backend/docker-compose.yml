# version: '3.8'  # Deprecated in newer docker-compose

services:
  # ========================================
  # Infrastructure Services (No Database)
  # ========================================

  # Redis for Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: myunila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myunila-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MeiliSearch for Full-Text Search
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: myunila-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123456}
      MEILI_NO_ANALYTICS: true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - myunila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

