    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Nginx Web Server
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: myunila-nginx
    ports:
      - "8081:80"
      - "8082:81"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/auth-service.conf:/etc/nginx/conf.d/auth-service.conf:ro
      - ./docker/nginx/conf.d/dashboard-service.conf:/etc/nginx/conf.d/dashboard-service.conf:ro
      - ./auth-service/public:/var/www/auth-service/public
      - ./dashboard-service/public:/var/www/dashboard-service/public
    networks:
      - myunila-network
    depends_on:
      - auth-service
      - dashboard-service
    restart: unless-stopped

# ========================================
# Networks
# ========================================
networks:
  myunila-network:
    driver: bridge
    name: myunila-network

# ========================================
# Volumes
# ========================================
volumes:
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  auth_vendor:
    driver: local
  dashboard_vendor:
    driver: local
