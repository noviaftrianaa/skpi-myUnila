  # ========================================
  # Microservices (Using External Databases)
  # ========================================

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: myunila-auth-service
    working_dir: /var/www
    env_file:
      - ./auth-service/.env
    environment:
      # Override for Docker networking only
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./auth-service:/var/www
      - auth_vendor:/var/www/vendor
    networks:
      - myunila-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  # Dashboard Service
  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    container_name: myunila-dashboard-service
    working_dir: /var/www
    env_file:
      - ./dashboard-service/.env
    environment:
      # Override for Docker networking only
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: meilisearch
      MEILISEARCH_PORT: 7700
    volumes:
      - ./dashboard-service:/var/www
      - dashboard_vendor:/var/www/vendor
    networks:
      - myunila-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - meilisearch
    restart: unless-stopped

  # Sister Service (Go + Fiber)
  sister-service:
    build:
