  # ========================================
  # Microservices (Using External Databases)
  # ========================================

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: myunila-auth-service
    working_dir: /var/www
    env_file:
      - ./auth-service/.env
    environment:
      # Override for Docker networking only
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./auth-service:/var/www
      - auth_vendor:/var/www/vendor
    networks:
      - myunila-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped


  # ========================================
  # Nginx Web Server
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: myunila-nginx
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/auth-only.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth-service/public:/var/www/auth-service/public
    networks:
      - myunila-network
    depends_on:
      - auth-service
    restart: unless-stopped

# ========================================
# Networks
# ========================================
networks:
  myunila-network:
    driver: bridge
    name: myunila-network

# ========================================
# Volumes (Redis data and auth-service vendor only)
# ========================================
volumes:
  redis_data:
    driver: local
  auth_vendor:
    driver: local
