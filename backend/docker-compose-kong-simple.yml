version: '3.8'

services:
  # PostgreSQL Database for Kong
  kong-database:
    image: postgres:9.6-alpine
    container_name: myunila-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - kong-net
    ports:
      - "5433:5432"  # Expose for debugging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Database Migration (Run once to setup Kong database)
  kong-migration:
    image: kong:3.4
    container_name: myunila-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-net
    restart: on-failure

  # Kong API Gateway
  kong:
    image: kong:3.4
    container_name: myunila-kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
    ports:
      - "9800:8000"   # Kong Proxy (HTTP) - Changed to 9800
      - "9843:8443"   # Kong Proxy (HTTPS) - Changed to 9843
      - "9801:8001"   # Kong Admin API (HTTP) - Changed to 9801
      - "9844:8444"   # Kong Admin API (HTTPS) - Changed to 9844
      - "9802:8002"   # Kong Manager (GUI) - Enterprise only, will show error page
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    networks:
      - kong-net
      - myunila-network  # Connect to existing network to access auth-service
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kong UI - Simple HTTP server to serve custom dashboard
  kong-ui:
    image: nginx:alpine
    container_name: myunila-kong-ui
    ports:
      - "9803:80"   # Kong Dashboard UI
    volumes:
      - ./kong/ui:/usr/share/nginx/html:ro
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - kong-net
    restart: unless-stopped

networks:
  kong-net:
    driver: bridge
  myunila-network:
    external: true  # Use existing network from docker-compose.yml

volumes:
  kong-db-data:
    driver: local
