apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://myunila-prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      httpMethod: 'POST'

  # Loki datasource for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://myunila-loki:3100
    editable: true
    jsonData:
      maxLines: 1000
