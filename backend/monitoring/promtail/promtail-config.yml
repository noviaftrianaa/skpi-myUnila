server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://myunila-loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - All myunila containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers with name starting with 'myunila-'
      - source_labels: ['__meta_docker_container_name']
        regex: '/myunila-.*'
        action: keep
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(myunila-.*)'
        target_label: 'container'
        replacement: '$1'
      # Get service name from compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Get container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
    pipeline_stages:
      - docker: {}

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
