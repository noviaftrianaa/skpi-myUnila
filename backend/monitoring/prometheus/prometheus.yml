global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'myunila-monitoring'
    environment: 'development'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Kong Gateway metrics via Prometheus plugin
  - job_name: 'kong'
    scrape_interval: 10s
    static_configs:
      - targets: ['myunila-kong-gateway:8001']
        labels:
          service: 'kong-gateway'
          environment: 'development'
    metrics_path: '/metrics'

  # Nginx exporter (if configured)
  - job_name: 'nginx'
    static_configs:
      - targets: ['myunila-nginx:8090']
        labels:
          service: 'nginx'
          environment: 'development'

  # Redis exporter - Now enabled
  - job_name: 'redis'
    static_configs:
      - targets: ['myunila-redis-exporter:9121']
        labels:
          service: 'redis'
          environment: 'development'

  # Node Exporter - Host system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['myunila-node-exporter:9100']
        labels:
          service: 'node-exporter'
          environment: 'development'

  # cAdvisor - Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['myunila-cadvisor:8080']
        labels:
          service: 'container-metrics'
          environment: 'development'

  # PostgreSQL exporter (optional - requires postgres_exporter)
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'kong-database'
