active:
  get:
    tags:
      - Monitoring
    summary: Get Active Sync Progress
    description: Mengambil progress sinkronisasi yang sedang berjalan
    operationId: getActiveSyncProgress
    security: []
    responses:
      '200':
        description: Berhasil mengambil progress aktif
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      sync_id:
                        type: string
                      sync_type:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, failed]
                      progress:
                        type: integer
                      started_at:
                        type: string
                        format: date-time
