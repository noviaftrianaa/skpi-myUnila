list:
  get:
    tags:
      - Scheduler
    summary: Get List Schedules
    description: Mengambil daftar jadwal sinkronisasi
    operationId: getScheduleList
    responses:
      '200':
        description: Berhasil mengambil daftar schedule
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../schemas/scheduler.yaml#/Schedule'

  post:
    tags:
      - Scheduler
    summary: Create Schedule
    description: Membuat jadwal sinkronisasi baru
    operationId: createSchedule
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - cron_expression
              - sync_type
            properties:
              name:
                type: string
                example: Sync Dosen Harian
              cron_expression:
                type: string
                example: "0 2 * * *"
              sync_type:
                type: string
                enum: [dosen, penugasan, penelitian, publikasi, pendidikan, referensi]
              params:
                type: object
              is_active:
                type: boolean
                default: true
    responses:
      '201':
        description: Schedule berhasil dibuat

detail:
  get:
    tags:
      - Scheduler
    summary: Get Schedule Detail
    description: Mengambil detail jadwal berdasarkan ID
    operationId: getScheduleDetail
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Berhasil mengambil detail schedule

  put:
    tags:
      - Scheduler
    summary: Update Schedule
    description: Memperbarui jadwal sinkronisasi
    operationId: updateSchedule
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Schedule berhasil diupdate

  delete:
    tags:
      - Scheduler
    summary: Delete Schedule
    description: Menghapus jadwal sinkronisasi
    operationId: deleteSchedule
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Schedule berhasil dihapus
