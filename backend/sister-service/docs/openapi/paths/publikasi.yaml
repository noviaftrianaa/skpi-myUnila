list:
  get:
    tags:
      - Publikasi
    summary: Get List Publikasi
    description: Mengambil daftar publikasi dosen
    operationId: getPublikasiList
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
      - name: id_sdm
        in: query
        description: Filter berdasarkan ID SDM dosen
        schema:
          type: string
    responses:
      '200':
        description: Berhasil mengambil data publikasi
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../schemas/publikasi.yaml#/Publikasi'
                pagination:
                  $ref: '../schemas/common.yaml#/Pagination'

sync:
  post:
    tags:
      - Publikasi
    summary: Sinkronisasi Publikasi
    description: Melakukan sinkronisasi data publikasi dari Sister
    operationId: syncPublikasi
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              id_sdm:
                type: string
                description: ID SDM dosen (opsional)
    responses:
      '200':
        description: Sinkronisasi berhasil dimulai
