openapi: 3.1.0
info:
  title: Sister Service API
  description: |
    API untuk sinkronisasi data dari Sister Kemdikbud ke MyUnila/OneData PDDIKTI.

    ## Fitur Utama
    - Sinkronisasi data dosen dari Sister Kemdikbud
    - Sinkronisasi data penugasan, penelitian, dan publikasi
    - Sinkronisasi riwayat pendidikan dan pekerjaan dosen
    - Sinkronisasi sertifikasi dan bidang ilmu
    - Data referensi lengkap dari Sister
    - Manajemen scheduler untuk sinkronisasi otomatis

    ## Authentication
    Sebagian besar endpoint memerlukan JWT Bearer token yang divalidasi melalui Kong Gateway.
  version: 1.0.0
  contact:
    name: Tim MyUnila
    email: myunila@unila.ac.id
    url: https://my.unila.ac.id
  license:
    name: Internal Use Only
    url: https://unila.ac.id

servers:
  - url: http://localhost:8083
    description: Local Development
  - url: http://localhost:9800/sister
    description: Via Kong Gateway (Local)
  - url: https://api.unila.ac.id/sister
    description: Production

tags:
  - name: Health
    description: Health check endpoint
  - name: Dosen
    description: Sinkronisasi data dosen dari Sister Kemdikbud
  - name: Penugasan
    description: Data penugasan dosen
  - name: Penelitian
    description: Data penelitian dan pengabdian
  - name: Publikasi
    description: Data publikasi dosen
  - name: Pendidikan
    description: Riwayat pendidikan formal dosen
  - name: Riwayat Pekerjaan
    description: Riwayat pekerjaan dosen
  - name: Riwayat Fungsional
    description: Riwayat jabatan fungsional
  - name: Jabatan Struktural
    description: Jabatan struktural dosen
  - name: Tugas Tambahan
    description: Tugas tambahan dosen
  - name: Sertifikasi Dosen
    description: Sertifikasi dosen
  - name: Bidang Ilmu
    description: Bidang ilmu dosen
  - name: Referensi
    description: Data referensi master dari Sister
  - name: Scheduler
    description: Manajemen jadwal sinkronisasi otomatis
  - name: Sync Logs
    description: Log sinkronisasi
  - name: Monitoring
    description: Monitoring proses sinkronisasi real-time

paths:
  /health:
    $ref: './paths/health.yaml#/health'

  # Dosen
  /api/v1/dosen:
    $ref: './paths/dosen.yaml#/list'
  /api/v1/dosen/stats:
    $ref: './paths/dosen.yaml#/stats'
  /api/v1/dosen/sync:
    $ref: './paths/dosen.yaml#/sync'
  /api/v1/dosen/{id_sdm}:
    $ref: './paths/dosen.yaml#/detail'

  # Penugasan
  /api/v1/penugasan:
    $ref: './paths/penugasan.yaml#/list'
  /api/v1/penugasan/stats:
    $ref: './paths/penugasan.yaml#/stats'
  /api/v1/penugasan/sync:
    $ref: './paths/penugasan.yaml#/sync'

  # Penelitian
  /api/v1/penelitian:
    $ref: './paths/penelitian.yaml#/list'
  /api/v1/penelitian/sync:
    $ref: './paths/penelitian.yaml#/sync'

  # Publikasi
  /api/v1/publikasi:
    $ref: './paths/publikasi.yaml#/list'
  /api/v1/publikasi/sync:
    $ref: './paths/publikasi.yaml#/sync'

  # Pendidikan
  /api/v1/pendidikan:
    $ref: './paths/pendidikan.yaml#/list'
  /api/v1/pendidikan/sync:
    $ref: './paths/pendidikan.yaml#/sync'

  # Referensi
  /api/v1/referensi/metadata:
    $ref: './paths/referensi.yaml#/metadata'
  /api/v1/referensi/batch-sync:
    $ref: './paths/referensi.yaml#/batch-sync'

  # Scheduler
  /api/v1/schedules:
    $ref: './paths/scheduler.yaml#/list'
  /api/v1/schedules/{id}:
    $ref: './paths/scheduler.yaml#/detail'

  # Sync Logs
  /api/v1/sync-logs:
    $ref: './paths/sync-logs.yaml#/list'

  # Monitoring
  /api/v1/monitoring/active:
    $ref: './paths/monitoring.yaml#/active'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token dari Kong Gateway

  schemas:
    $ref: './schemas/_index.yaml'

  responses:
    $ref: './responses/_index.yaml'

security:
  - bearerAuth: []
