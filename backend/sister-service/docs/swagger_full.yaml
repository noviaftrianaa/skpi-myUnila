host: localhost:8083
info:
  contact:
    email: support@unila.ac.id
    name: API Support
  description: |-
    API for synchronizing data from Sister Kemdikbud to MyUnila/OneData PDDIKTI.

    This API provides 34 referensi (reference data) endpoints:
    - 5 Original: agama, negara, jenjang_pendidikan, gelar_akademik, semester
    - 29 New: bidang_studi, bidang_usaha, jabatan_fungsional, jabatan_tugas_tambahan,
             jenis_bahan_ajar, jenis_beasiswa, jenis_diklat, jenis_dokumen, jenis_keluar,
             jenis_kepanitiaan, jenis_kesejahteraan, jenis_publikasi, jenis_tes, jenis_tunjangan,
             media_publikasi, skim_kegiatan, status_kepegawaian, sumber_gaji, tingkat_penghargaan,
             wilayah, kategori_capaian_luaran, kategori_kegiatan, kelompok_bidang,
             lembaga_sertifikasi, golongan_pangkat, ikatan_kerja, jenis_penghargaan,
             jenis_pekerjaan, bidang_pekerjaan

    Each endpoint provides:
    - GET /api/v1/referensi/{endpoint} - Retrieve all records
    - POST /api/v1/referensi/{endpoint}/sync - Sync from Sister API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Sister Service API
  version: "1.0"

paths:
  # Original 5 endpoints (keeping original format)
  /api/v1/referensi/agama:
    get:
      consumes: [application/json]
      description: Retrieve all agama (religion) reference data
      produces: [application/json]
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items: { $ref: '#/definitions/referensi.Agama' }
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema: { $ref: '#/definitions/response.APIResponse' }
      security: [{ BearerAuth: [] }]
      summary: Get all agama
      tags: [Referensi]

  /api/v1/referensi/agama/{id}:
    get:
      consumes: [application/json]
      description: Retrieve agama (religion) reference data by ID
      parameters:
      - description: Agama ID
        in: path
        name: id
        required: true
        type: integer
      produces: [application/json]
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data: { $ref: '#/definitions/referensi.Agama' }
              type: object
        "400": { description: Bad Request, schema: { $ref: '#/definitions/response.APIResponse' } }
        "404": { description: Not Found, schema: { $ref: '#/definitions/response.APIResponse' } }
        "500": { description: Internal Server Error, schema: { $ref: '#/definitions/response.APIResponse' } }
      security: [{ BearerAuth: [] }]
      summary: Get agama by ID
      tags: [Referensi]

  /api/v1/referensi/agama/sync:
    post:
      consumes: [application/json]
      description: Synchronize agama (religion) data from Sister Kemdikbud API. User identity is automatically extracted from JWT token.
      produces: [application/json]
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data: { $ref: '#/definitions/referensi.SyncResponse' }
              type: object
        "401": { description: Unauthorized - Missing or invalid JWT token, schema: { $ref: '#/definitions/response.APIResponse' } }
        "403": { description: Forbidden - Requires Developer role, schema: { $ref: '#/definitions/response.APIResponse' } }
        "500": { description: Internal Server Error, schema: { $ref: '#/definitions/response.APIResponse' } }
      security: [{ BearerAuth: [] }]
      summary: Sync agama from Sister API
      tags: [Referensi]

  # NOTE: For complete documentation of all 29 new endpoints, each follows this pattern:
  # GET /api/v1/referensi/{endpoint} - Returns array of entity objects
  # POST /api/v1/referensi/{endpoint}/sync - Syncs from SISTER API
  #
  # New endpoints: bidang-studi, bidang-usaha, jabatan-fungsional, jabatan-tugas-tambahan,
  # jenis-bahan-ajar, jenis-beasiswa, jenis-diklat, jenis-dokumen, jenis-keluar,
  # jenis-kepanitiaan, jenis-kesejahteraan, jenis-publikasi, jenis-tes, jenis-tunjangan,
  # media-publikasi, skim-kegiatan, status-kepegawaian, sumber-gaji, tingkat-penghargaan,
  # wilayah, kategori-capaian-luaran, kategori-kegiatan, kelompok-bidang,
  # lembaga-sertifikasi, golongan-pangkat, ikatan-kerja, jenis-penghargaan,
  # jenis-pekerjaan, bidang-pekerjaan
  #
  # All endpoints are LIVE and accessible. See tools/swagger_yaml_additions.txt for full documentation.

schemes: [http, https]
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
