list:
  get:
    tags:
      - Sync Logs
    summary: Get Sync Logs
    description: Mengambil daftar log sinkronisasi
    operationId: getSyncLogs
    security: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: sync_type
        in: query
        description: Filter berdasarkan tipe sync
        schema:
          type: string
      - name: status
        in: query
        description: Filter berdasarkan status
        schema:
          type: string
          enum: [running, completed, failed]
    responses:
      '200':
        description: Berhasil mengambil log sinkronisasi
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../schemas/sync-log.yaml#/SyncLog'
                pagination:
                  $ref: '../schemas/common.yaml#/Pagination'
