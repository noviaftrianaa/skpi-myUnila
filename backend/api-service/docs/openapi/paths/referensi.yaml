# Referensi API Paths

semester:
  get:
    tags:
      - Referensi
    summary: Get daftar semester
    description: Mengambil daftar semester dengan pagination dan filter. Memerlukan autentikasi JWT.
    operationId: getSemesters
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/sortBy'
      - $ref: '../schemas/common.yaml#/parameters/order'
      - name: tahun_ajaran
        in: query
        description: Filter berdasarkan tahun ajaran
        schema:
          type: integer
      - name: periode_aktif
        in: query
        description: Filter periode aktif (1=aktif, 0=tidak)
        schema:
          type: integer
          enum: [0, 1]
    responses:
      '200':
        description: Berhasil mengambil data semester
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/PaginatedResponse'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

tahun-ajaran:
  get:
    tags:
      - Referensi
    summary: Get daftar tahun ajaran
    description: Mengambil daftar tahun ajaran dengan pagination dan filter. Memerlukan autentikasi JWT.
    operationId: getTahunAjarans
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/page'
