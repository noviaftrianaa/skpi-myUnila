      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

wilayah:
  get:
    tags:
      - Referensi
    summary: Get daftar wilayah
    description: |
      Mengambil daftar wilayah dengan pagination dan filter level.

      Level wilayah:
      - 1 = Provinsi
      - 2 = Kabupaten/Kota
      - 3 = Kecamatan
      - 4 = Kelurahan/Desa

      Memerlukan autentikasi JWT.
    operationId: getWilayahs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/sortBy'
      - $ref: '../schemas/common.yaml#/parameters/order'
      - name: level
        in: query
        description: Level wilayah (1=Provinsi, 2=Kab/Kota, 3=Kecamatan, 4=Kelurahan)
        schema:
          type: integer
          enum: [1, 2, 3, 4]
      - name: id_induk_wilayah
        in: query
        description: Filter berdasarkan ID induk wilayah
        schema:
          type: string
      - name: id_negara
        in: query
        description: Filter berdasarkan ID negara
        schema:
          type: string
    responses:
      '200':
        description: Berhasil mengambil data wilayah
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/PaginatedResponse'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

