      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/sortBy'
      - $ref: '../schemas/common.yaml#/parameters/order'
      - name: periode_aktif
        in: query
        description: Filter periode aktif (1=aktif, 0=tidak)
        schema:
          type: integer
          enum: [0, 1]
    responses:
      '200':
        description: Berhasil mengambil data tahun ajaran
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/PaginatedResponse'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

