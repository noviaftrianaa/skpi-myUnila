    operationId: getKelasKuliahList
    security: [{ BearerAuth: [] }]
    parameters:
      - name: id_smt
        in: query
        description: Filter semester (cth 20241 = Ganjil 2024/2025)
        schema: { type: integer, example: 20251 }
      - name: id_sms
        in: query
        schema: { type: string, format: uuid }
      - name: id_mk
        in: query
        schema: { type: string, format: uuid }
      - name: id_kls
        in: query
        schema: { type: string, format: uuid }
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
    responses:
      '200': { description: OK }

list-jadwal-kelas:
  get:
    tags: [Akademik]
    summary: List jadwal kelas
    description: Jadwal per kelas kuliah (pertemuan/tanggal/waktu/lokasi).
    operationId: getJadwalKelasList
    security: [{ BearerAuth: [] }]
    parameters:
      - name: id_kls
        in: query
        schema: { type: string, format: uuid }
      - name: id_smt
        in: query
        schema: { type: integer }
      - name: status
        in: query
        schema: { type: string }
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
    responses:
      '200': { description: OK }

list-kurikulum:
  get:
    tags: [Akademik]
    summary: List kurikulum prodi
    description: Kurikulum per prodi per semester (pdrd.kurikulum_sp).
    operationId: getKurikulumList
    security: [{ BearerAuth: [] }]
    parameters:
      - name: id_sms
        in: query
        schema: { type: string, format: uuid }
      - name: id_smt
        in: query
        schema: { type: integer }
      - name: id_jenj_didik
        in: query
        schema: { type: integer }
      - name: a_digunakan
        in: query
        description: 1 = kurikulum aktif
        schema: { type: integer, enum: [0,1] }
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
    responses:
      '200': { description: OK }
