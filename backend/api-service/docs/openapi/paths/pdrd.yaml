# PEGAWAI — sumber: SIKEP (schema sikep.pegawai)
# =============================================================================

list-pegawai:
  get:
    tags:
      - Pegawai
    summary: List pegawai (SIKEP)
    description: |
      Daftar pegawai dari schema `sikep.pegawai`. Berbeda sumber dengan
      `/list_sdm` yang ambil dari `pdrd.sdm` (SISTER).

      **Sumber data:** SIKEP (Sistem Kepegawaian Unila).

      Filter populer:
      - `jns_pegawai` — PNS / PPPK / Honorer
      - `jns_tenaga` — Dosen / Tendik / Fungsional / Struktural
      - `id_unit_orga` — filter unit organisasi
    operationId: getPegawaiList
    security: [{ BearerAuth: [] }]
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
      - $ref: '../schemas/common.yaml#/parameters/search'
      - name: jns_pegawai
        in: query
        schema: { type: string }
      - name: jns_tenaga
        in: query
        schema: { type: string }
      - name: nip
        in: query
        schema: { type: string }
      - name: id_unit_orga
        in: query
        schema: { type: integer }
      - name: id_gol
        in: query
        schema: { type: integer }
      - name: id_jabfung
        in: query
        schema: { type: integer }
      - name: id_jabstruk
        in: query
        schema: { type: integer }
      - name: status
        in: query
        schema: { type: string }
    responses:
      '200':
        description: OK
      '401': { $ref: '../responses/errors.yaml#/Unauthorized' }

detail-pegawai:
  get:
    tags:
      - Pegawai
    summary: Detail pegawai (SIKEP) — dengan FK+nama ref
    description: |
      Detail 1 atau lebih pegawai dengan JOIN ke:
      - `sikep.golongan_pns` → nama golongan + pangkat
      - `sikep.jabfung` → nama jabatan fungsional
      - `sikep.jabstruk` → nama jabatan struktural
      - `sikep.pendidikan` → nama pendidikan
      - `sikep.unit_orga` → nama unit organisasi

      **Minimal 1 filter wajib:** `id_pegawai`, `nip`, atau `search`.
    operationId: getPegawaiDetail
    security: [{ BearerAuth: [] }]
    parameters:
      - name: id_pegawai
        in: query
        schema: { type: string, format: uuid }
      - name: nip
        in: query
        schema: { type: string }
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
    responses:
      '200':
        description: OK
      '400': { $ref: '../responses/errors.yaml#/BadRequest' }
      '401': { $ref: '../responses/errors.yaml#/Unauthorized' }

