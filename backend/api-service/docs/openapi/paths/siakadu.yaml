      - { name: id_pimpinan, in: query, schema: { type: string, format: uuid } }
      - { name: id_unit, in: query, schema: { type: string } }
      - { name: id_sdm, in: query, schema: { type: string, format: uuid } }
      - { name: nip, in: query, schema: { type: string } }
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
