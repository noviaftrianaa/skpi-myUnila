list-siakadu-kelas-ukt:
  get:
    tags: [Siakadu]
    summary: List master kelas UKT (nominal per tier)
    operationId: listSiakaduKelasUkt
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: id_kelas_ukt, in: query, schema: { type: string, format: uuid } }
      - $ref: '../schemas/common.yaml#/parameters/search'
      - $ref: '../schemas/common.yaml#/parameters/page'
      - $ref: '../schemas/common.yaml#/parameters/limit'
