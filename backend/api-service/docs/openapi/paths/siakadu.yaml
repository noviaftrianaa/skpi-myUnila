    security: [{ BearerAuth: [] }]
    parameters:
      - { name: id_reg_pd, in: query, schema: { type: string, format: uuid } }
      - { name: nim, in: query, schema: { type: string } }
      - { name: id_smt, in: query, schema: { type: string } }
