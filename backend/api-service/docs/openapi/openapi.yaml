openapi: 3.0.3
info:
  title: myUnila API Web Service
  description: |
    Layanan Web Service API untuk integrasi data antar sistem di lingkungan Universitas Lampung.

    **Base URL:** `/v1/...` (sama untuk staging dan production)
    
    **Environment:**
    - Staging: `http://192.168.120.45:9800/ws-service/v1`
    - Production: `https://my.unila.ac.id/ws-service/v1`

    Untuk permintaan penambahan endpoint atau akses API, hubungi PJ Aplikasi terkait atau tim pengembang.
  version: 1.0.0
  contact:
    name: Tim MyUnila - UPT TIK
    email: dev@unila.ac.id

servers:
  - url: /
    description: Relative (auto-detect environment)

tags:
  - name: Auth
    description: Autentikasi dan manajemen token
  - name: Referensi
    description: Data referensi master (semester, tahun ajaran, agama, wilayah)
  - name: PDRD
    description: Data peserta didik (mahasiswa) dan registrasi pendidikan
  - name: System
    description: System endpoints

