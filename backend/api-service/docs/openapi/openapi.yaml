openapi: 3.0.3
info:
  title: myUnila API Web Service
  description: |
    Layanan Web Service API untuk integrasi data antar sistem di lingkungan Universitas Lampung.

    **Server pilihan:**
    - 🔴 **Live** — `https://my.unila.ac.id/gateway/api-service` → production
    - 🟡 **Sandbox** — `http://192.168.120.45:9800/api-service` → staging (akses VPN UPA TIK)

    Pilih server via dropdown di atas "Authorize" button. Semua path di bawah
    otomatis menambahkan base URL server yang dipilih + `/v1/...`.

    **Endpoint publik (tanpa JWT):**
    - `GET /v1/dashboard/ktw/*` — statistik Kelulusan Tepat Waktu. Lihat tag `Dashboard · KTW`.

    **Grouping (best practice):**
    Mulai Apr 2026, endpoint di-group per domain:
    `/v1/mahasiswa`, `/v1/sdm`, `/v1/pegawai`, `/v1/akademik`, `/v1/penelitian`.
    URL lama `/v1/pdrd/*` tetap jalan (backward compat) tapi dianggap **deprecated**.

    Untuk permintaan penambahan endpoint atau akses API, hubungi PJ Aplikasi terkait atau tim pengembang.
  version: 1.0.0
  contact:
    name: Tim MyUnila - UPT TIK
    email: dev@unila.ac.id

servers:
  - url: https://my.unila.ac.id/gateway/api-service
    description: 🔴 Live — Production (akses publik via my.unila.ac.id)
  - url: http://192.168.120.45:9800/api-service
    description: 🟡 Sandbox — Staging (akses VPN UPA TIK)

tags:
  - name: Auth
    description: Autentikasi dan manajemen token (login, check token)
  - name: Mahasiswa
    description: |
      Data peserta didik / mahasiswa — biodata, registrasi, riwayat pendidikan,
      status kuliah per semester.
  - name: Akademik
    description: |
      Master mata kuliah, kurikulum, kelas kuliah, jadwal kelas, rencana ajar.
  - name: SDM
    description: |
      Data SDM (dosen + tendik) — biodata, penugasan/homebase,
      riwayat pendidikan/fungsional/kepangkatan/tugas tambahan/sertifikasi.
  - name: Pegawai
    description: |
      Data pegawai (tendik + struktural) dari sistem kepegawaian. Berbeda
      source dengan SDM (SISTER).
  - name: Penelitian & Pengabdian
    description: |
      Litabmas = Penelitian & Pengabdian kepada Masyarakat (filter
      `jns_litabmas`: L=Penelitian, M=Pengabdian).
  - name: Publikasi
    description: |
      Publikasi ilmiah dosen & mahasiswa (jurnal, prosiding, buku, dll).
  - name: Institusi
    description: |
      Profil institusi: program studi, satuan pendidikan (fakultas),
      profil prodi per tahun ajaran, akreditasi.
  - name: Kontribusi
    description: |
      Kontribusi akademik dosen & mahasiswa: narasumber/pembicara, pengelola jurnal,
      buku ajar, kepanitiaan, prestasi mahasiswa.
  - name: Tracer Study
    description: |
      Survei alumni (tracer study) — status kerja, waktu tunggu, income, kesesuaian
      bidang, survei atasan. **Full CRUD** untuk sync dari aplikasi tracer eksternal
      via POST/PUT/DELETE.

      **IKU 2 fields (sync dari tracer):**
      - `hasil_tracer_study`: jenis_wirausaha (founder/freelancer), c_kerja_terakhir,
        id_wil_kota, respon_perusahaan, wawancara
      - `hasil_tracer_atasan`: kepuasan_terhadap_alumni (JSON), kompetensi_perusahaan
        (JSON), alamat_tmpt_kerja, metode_pembelajaran (JSON)

      **status_lulusan enum:** 1=Bekerja, 2=Wirausaha, 3=Lanjut Studi, 4=Belum Bekerja.
  - name: Siakadu
    description: |
      Data SIAKADU (dipopulate oleh myunila-service sync). **GET-only** — write
      tetap via myunila-service. Response include UUID bridging (id_pd, id_reg_pd,
      id_sdm, id_sms) + denormalized names (nm_fakultas, nm_jurusan, nm_prodi, dll).
  - name: Kerjasama
    description: |
      LP2M / Bagian Kerjasama — **Full CRUD** untuk MOU, kerjasama prodi, dan
      master DUDI (mitra). Referensi master ada di `/v1/referensi/*`
      (aktifitas_kerjasama, kriteria_mitra, tingkat_kerjasama, bidang_kerjasama,
      bentuk_kegiatan_kerjasama, status_kerjasama).
  - name: MBKM
    description: |
      Kampus Merdeka (MBKM) — pendaftaran + konversi MK + log book.
      **GET-only** untuk sync ke aplikasi konsumen.
      Sub-modul: daftar_kampus_merdeka, periode_kampus_merdeka, mk_konversi,
      konversi_akt_mhs, ekuiv_transfer, log_book_mbkm.
      **Note:** full KKN lifecycle ada di service terpisah (si-kkn).
  - name: Referensi
    description: Data referensi master (semester, tahun ajaran, agama, wilayah, dll)
  - name: Dashboard · KTW
    description: |
      Statistik Kelulusan Tepat Waktu (KTW) — endpoint **publik tanpa JWT**.
      Data agregat per angkatan/fakultas/prodi untuk BAN-PT, aplikasi fakultas,
      dashboard eksekutif, dan integrasi pihak ketiga.
  - name: System
    description: System endpoints (administrative)

