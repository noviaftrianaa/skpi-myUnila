# ===========================================
# Nginx Configuration for Laravel Microservices
# ===========================================

# Upstream PHP-FPM backends
upstream auth_backend {
    server auth-service:9000;
}

upstream portal_backend {
    server portal-service:9000;
}

upstream integrator_backend {
    server integrator-service:9000;
}

upstream akademik_backend {
    server akademik-service:9000;
}

# ===========================================
# Auth Service (Port 8081)
# ===========================================
server {
    listen 80;
    server_name auth.myunila.local;
    root /var/www/auth-service/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/auth-access.log;
    error_log /var/log/nginx/auth-error.log;

    # Security headers
    add_header X-Service-Name "Auth Service" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass auth_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

