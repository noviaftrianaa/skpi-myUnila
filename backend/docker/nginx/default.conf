# ===========================================
# Health Check Endpoint
# ===========================================
server {
    listen 8090;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx-status {
        stub_status on;
        access_log off;
    }
}
