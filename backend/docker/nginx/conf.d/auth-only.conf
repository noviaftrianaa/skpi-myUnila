# ===========================================
# Auth Service - Nginx Configuration
# Single service configuration (no portal/integrator/akademik)
# ===========================================

# Upstream PHP-FPM backend
upstream auth_backend {
    server auth-service:9000;
}

# ===========================================
# Auth Service (Port 80)
# ===========================================
server {
    listen 80;
    server_name localhost;
    root /var/www/auth-service/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/auth-access.log;
    error_log /var/log/nginx/auth-error.log;

    # Security headers
    add_header X-Service-Name "Auth Service" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size
    client_max_body_size 20M;

    # Handle all requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass auth_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ===========================================
# Health Check Endpoint
# ===========================================
server {
    listen 8090;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx-status {
        stub_status on;
        access_log off;
    }
}
