# version: '3.8'

services:
  # PostgreSQL Database for Kong
  kong-database:
    image: postgres:9.6-alpine
    container_name: myunila-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Database Migration (Run once to setup Kong database)
  kong-migration:
    image: kong:3.4
    container_name: myunila-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-net
    restart: on-failure

  # Kong API Gateway
  kong:
    image: kong:3.4
    container_name: myunila-kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"   # Kong Proxy (HTTP)
      - "8443:8443"   # Kong Proxy (HTTPS)
      - "8001:8001"   # Kong Admin API (HTTP)
      - "8444:8444"   # Kong Admin API (HTTPS)
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    networks:
      - kong-net
      - myunila-network  # Connect to existing network to access auth-service
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Konga Database Preparation
  konga-prepare:
    image: pantsel/konga:latest
    container_name: myunila-konga-prepare
    command: "-c prepare -a postgres -u postgresql://kong:kong_password@kong-database:5432/konga"
    networks:
      - kong-net
    restart: on-failure
    depends_on:
      kong-database:
        condition: service_healthy

  # Kong Admin UI (Konga)
  konga:
    image: pantsel/konga:latest
    container_name: myunila-konga
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_DATABASE: konga
      DB_USER: kong
      DB_PASSWORD: kong_password
    ports:
      - "1337:1337"
    depends_on:
      kong-database:
        condition: service_healthy
      konga-prepare:
        condition: service_completed_successfully
    networks:
      - kong-net
    restart: on-failure

networks:
  kong-net:
    driver: bridge
  myunila-network:
    external: true  # Use existing network from docker-compose.yml

volumes:
  kong-db-data:
    driver: local
