version: '3.8'

services:
  dashboard-service:
    build:
      context: ../../../../backend/dashboard-service
      dockerfile: Dockerfile.debian  # Using Debian for better PECL compatibility
    image: myunila/dashboard-service:latest
    container_name: myunila-dashboard-service
    working_dir: /var/www
    env_file:
      - ../../.env
    environment:
      # Redis (override from env_file if needed)
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - dashboard_storage:/var/www/storage
      - dashboard_logs:/var/www/storage/logs
    networks:
      - myunila-network
    depends_on:
      - redis-check
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master process' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=dashboard"

  # Redis health check
  redis-check:
    image: redis:7-alpine
    container_name: myunila-redis-check-dashboard
    command: >
      sh -c "
      until redis-cli -h redis ping; do
        echo 'Waiting for Redis...';
        sleep 2;
      done;
      echo 'Redis is ready!';
      "
    networks:
      - myunila-network
    restart: "no"

networks:
  myunila-network:
    external: true
    name: myunila-network

volumes:
  dashboard_storage:
    driver: local
    name: myunila-dashboard-storage
  dashboard_logs:
    driver: local
    name: myunila-dashboard-logs
