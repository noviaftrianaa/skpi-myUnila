version: '3.8'

services:
  si-kkn-service:
    build:
      context: ../../../../backend/si-kkn-service
      dockerfile: Dockerfile
    image: myunila/si-kkn-service:latest
    container_name: myunila-si-kkn-service
    working_dir: /var/www
    # Port exposed via nginx (8094:88 -> si-kkn-service:9000)
    expose:
      - "9000"
    env_file:
      - ../../.env
    environment:
      # App Config
      APP_NAME: "${SI_KKN_APP_NAME:-SI KKN Service}"
      APP_ENV: "${SI_KKN_APP_ENV:-local}"
      APP_KEY: "${SI_KKN_APP_KEY}"
      APP_DEBUG: "${SI_KKN_APP_DEBUG:-true}"
      APP_URL: "${SI_KKN_APP_URL:-http://localhost:8094}"
      APP_APLIKASI_ID: "${APP_APLIKASI_ID}"

      # Primary Database (PostgreSQL - sikkn_myunila)
      DB_CONNECTION: "${SI_KKN_DB_CONNECTION:-pgsql}"
      DB_HOST: "${SI_KKN_DB_HOST:-postgres}"
      DB_PORT: "${SI_KKN_DB_PORT:-5432}"
      DB_DATABASE: "${SI_KKN_DB_DATABASE:-sikkn_myunila}"
      DB_USERNAME: "${SI_KKN_DB_USERNAME}"
      DB_PASSWORD: "${SI_KKN_DB_PASSWORD}"

      # Secondary Database (SQL Server - pdut, read-only)
      SQLSRV_HOST: "${SI_KKN_SQLSRV_HOST}"
      SQLSRV_PORT: "${SI_KKN_SQLSRV_PORT:-1433}"
      SQLSRV_DATABASE: "${SI_KKN_SQLSRV_DATABASE:-pdut}"
      SQLSRV_USERNAME: "${SI_KKN_SQLSRV_USERNAME}"
      SQLSRV_PASSWORD: "${SI_KKN_SQLSRV_PASSWORD}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"

      # MinIO (S3-compatible)
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://192.168.120.47:9000}"
      MINIO_KEY: "${MINIO_KEY}"
      MINIO_SECRET: "${MINIO_SECRET}"
      MINIO_BUCKET: "${MINIO_BUCKET:-myunila-storage}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"

      # File Storage (default local; switch via env)
      FILESYSTEM_DISK: "${SI_KKN_FILESYSTEM_DISK:-kkn}"
      KKN_STORAGE_PATH: "/var/www/storage/app/kkn"

      # KKN WS API (legacy MySQL eKKN, optional)
      KKN_WS_API_BASE_URL: "${KKN_WS_API_BASE_URL:-}"
      KKN_WS_API_USERNAME: "${KKN_WS_API_USERNAME:-}"
      KKN_WS_API_PASSWORD: "${KKN_WS_API_PASSWORD:-}"

      # Redis
      REDIS_HOST: "${SI_KKN_REDIS_HOST:-redis}"
      REDIS_PORT: "${SI_KKN_REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_DRIVER: redis
      CACHE_PREFIX: kkn_
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # JWT Configuration
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-15}"
      JWT_REFRESH_TOKEN_TTL: "${JWT_REFRESH_TOKEN_TTL:-10080}"
      JWT_ALGO: "${JWT_ALGORITHM:-HS256}"

      # Permission
      BYPASS_PERMISSION_CHECK: "${BYPASS_PERMISSION_CHECK:-false}"

      TZ: "${TZ:-Asia/Jakarta}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kkn_storage:/var/www/storage
      - kkn_logs:/var/www/storage/logs
      # Hot reload: mount source code directories (read-only)
      - ../../../../backend/si-kkn-service/app:/var/www/app:ro
      - ../../../../backend/si-kkn-service/routes:/var/www/routes:ro
      - ../../../../backend/si-kkn-service/config:/var/www/config:ro
      - ../../../../backend/si-kkn-service/resources:/var/www/resources:ro
    networks:
      - myunila-network
    depends_on:
      - redis-check
      - postgres-check
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master process' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=kkn"

  # Redis health check
  redis-check:
    image: redis:7-alpine
    container_name: myunila-redis-check-kkn
    command: >
      sh -c "
      until redis-cli -h redis ping; do
        echo 'Waiting for Redis...';
        sleep 2;
      done;
      echo 'Redis is ready!';
      "
    networks:
      - myunila-network
    restart: "no"

  # Postgres health check
  postgres-check:
    image: postgres:16-alpine
    container_name: myunila-pg-check-kkn
    command: >
      sh -c "
      until pg_isready -h ${SI_KKN_DB_HOST:-postgres} -p ${SI_KKN_DB_PORT:-5432} -U ${SI_KKN_DB_USERNAME:-postgres}; do
        echo 'Waiting for PostgreSQL at ${SI_KKN_DB_HOST:-postgres}...';
        sleep 2;
      done;
      echo 'PostgreSQL is ready!';
      "
    networks:
      - myunila-network
    restart: "no"

networks:
  myunila-network:
    external: true
    name: myunila-network

volumes:
  kkn_storage:
    driver: local
    name: myunila-kkn-storage
  kkn_logs:
    driver: local
    name: myunila-kkn-logs
