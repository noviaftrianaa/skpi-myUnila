version: '3.8'

services:
  feeder-service:
    build:
      context: ../../../../backend/feeder-service
      dockerfile: Dockerfile
    image: myunila/feeder-service:latest
    container_name: myunila-feeder-service
    ports:
      - "8084:8084"
    environment:
      # App Configuration
      APP_NAME: ${FEEDER_APP_NAME:-Feeder Service}
      APP_PORT: ${FEEDER_APP_PORT:-:8084}
      APP_ENV: ${FEEDER_APP_ENV:-local}

      # Database Configuration
      DB_DRIVER: ${FEEDER_DB_DRIVER:-sqlserver}
      DB_HOST: ${FEEDER_DB_HOST}
      DB_PORT: ${FEEDER_DB_PORT}
      DB_USERNAME: ${FEEDER_DB_USERNAME}
      DB_PASSWORD: ${FEEDER_DB_PASSWORD}
      DB_DATABASE: ${FEEDER_DB_DATABASE}
      DB_MAX_OPEN_CONNS: ${FEEDER_DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${FEEDER_DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${FEEDER_DB_CONN_MAX_LIFETIME:-5m}

      # Feeder API Configuration (Fallback - Priority: Database > Environment)
      FEEDER_API_BASE_URL: ${FEEDER_API_BASE_URL:-https://dapelmikpdpt.unila.ac.id/New/ws/Api.php}
      FEEDER_API_USERNAME: ${FEEDER_API_USERNAME}
      FEEDER_API_PASSWORD: ${FEEDER_API_PASSWORD}

      # Encryption Key
      API_CONFIG_ENCRYPTION_KEY: ${API_CONFIG_ENCRYPTION_KEY}

      # Redis Configuration
      REDIS_HOST: ${FEEDER_REDIS_HOST:-redis}
      REDIS_PORT: ${FEEDER_REDIS_PORT:-6379}

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}
    networks:
      - myunila-network
    depends_on:
      - redis-check
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=feeder"

  # Redis health check
  redis-check:
    image: redis:7-alpine
    container_name: myunila-redis-check-feeder
    command: >
      sh -c "
      until redis-cli -h redis ping; do
        echo 'Waiting for Redis...';
        sleep 2;
      done;
      echo 'Redis is ready!';
      "
    networks:
      - myunila-network
    restart: "no"

networks:
  myunila-network:
    external: true
    name: myunila-network
