version: '3.8'

services:
  monitoring-service:
    build:
      context: ../../../../backend/monitoring
      dockerfile: Dockerfile
    image: myunila/monitoring-service:latest
    container_name: myunila-monitoring-service
    ports:
      - "8089:8089"
    env_file:
      - ../../.env
    environment:
      # App Configuration
      APP_NAME: ${MONITORING_APP_NAME:-Monitoring Service}
      APP_PORT: ${MONITORING_APP_PORT:-:8089}
      APP_ENV: ${MONITORING_APP_ENV:-local}

      # Database Configuration
      DB_DRIVER: ${MONITORING_DB_DRIVER:-sqlserver}
      DB_HOST: ${DB_MSSQL_HOST}
      DB_PORT: ${DB_MSSQL_PORT:-1433}
      DB_USERNAME: ${DB_MSSQL_USERNAME}
      DB_PASSWORD: ${DB_MSSQL_PASSWORD}
      DB_DATABASE: ${DB_MSSQL_DATABASE}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT (shared with auth-service)
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGO: ${JWT_ALGO:-HS256}

      # Blogger API
      BLOGGER_API_KEY: ${BLOGGER_API_KEY:-}

      # Google Search Console
      GSC_SERVICE_ACCOUNT_JSON: ${GSC_SERVICE_ACCOUNT_JSON:-/app/secrets/gsc-service-account.json}
      GSC_SITE_URL: ${GSC_SITE_URL:-sc-domain:unila.ac.id}
      GSC_AUTO_REMOVE_THRESHOLD: ${GSC_AUTO_REMOVE_THRESHOLD:-15}
      GSC_ENABLED: ${GSC_ENABLED:-false}

      # Crawler
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-3}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-500}
      CRAWLER_RATE_LIMIT_MS: ${CRAWLER_RATE_LIMIT_MS:-1000}
      CRAWLER_CONCURRENT_SITES: ${CRAWLER_CONCURRENT_SITES:-3}
      CRAWLER_TIMEOUT_SEC: ${CRAWLER_TIMEOUT_SEC:-30}

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ../../secrets:/app/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - myunila-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=monitoring"

networks:
  myunila-network:
    external: true
    name: myunila-network
