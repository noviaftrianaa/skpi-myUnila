version: '3.8'

services:
  public-service:
    build:
      context: ../../../../backend/public-service
      dockerfile: Dockerfile
    image: myunila/public-service:latest
    container_name: myunila-public-service
    working_dir: /var/www
    env_file:
      - ../../.env
    environment:
      # App Config
      APP_NAME: "${PUBLIC_APP_NAME:-MyUnila Public Service}"
      APP_ENV: "${PUBLIC_APP_ENV:-local}"
      APP_KEY: "${PUBLIC_APP_KEY}"
      APP_DEBUG: "${PUBLIC_APP_DEBUG:-true}"
      APP_URL: "${PUBLIC_APP_URL:-http://localhost:8082}"

      # Database (map PUBLIC_DB_* to DB_*)
      DB_CONNECTION: "${PUBLIC_DB_CONNECTION:-sqlsrv}"
      DB_HOST: "${PUBLIC_DB_HOST}"
      DB_PORT: "${PUBLIC_DB_PORT:-1433}"
      DB_DATABASE: "${PUBLIC_DB_DATABASE}"
      DB_USERNAME: "${PUBLIC_DB_USERNAME}"
      DB_PASSWORD: "${PUBLIC_DB_PASSWORD}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"

      # Sister DB (same as main DB)
      SISTER_DB_HOST: "${PUBLIC_DB_HOST}"
      SISTER_DB_PORT: "${PUBLIC_DB_PORT:-1433}"
      SISTER_DB_DATABASE: "${PUBLIC_DB_DATABASE}"
      SISTER_DB_USERNAME: "${PUBLIC_DB_USERNAME}"
      SISTER_DB_PASSWORD: "${PUBLIC_DB_PASSWORD}"

      # Redis
      REDIS_HOST: "${PUBLIC_REDIS_HOST:-redis}"
      REDIS_PORT: "${PUBLIC_REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Meilisearch
      MEILISEARCH_HOST: "${MEILISEARCH_HOST:-http://meilisearch:7700}"
      MEILISEARCH_KEY: "${MEILISEARCH_KEY:-}"

      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - public_storage:/var/www/storage
      - public_logs:/var/www/storage/logs
      # Hot reload: mount source code directories (read-only)
      - ../../../../backend/public-service/app:/var/www/app:ro
      - ../../../../backend/public-service/routes:/var/www/routes:ro
      - ../../../../backend/public-service/config:/var/www/config:ro
      - ../../../../backend/public-service/database/seeders:/var/www/database/seeders:ro
      - ../../../../backend/public-service/resources:/var/www/resources:ro
    networks:
      - myunila-network
    depends_on:
      - redis-check
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master process' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=public"

  # Public Scheduler (Supervisor)
  public-scheduler:
    image: myunila/public-service:latest
    container_name: myunila-public-scheduler
    working_dir: /var/www
    env_file:
      - ../../.env
    environment:
      # App Config
      APP_NAME: "${PUBLIC_APP_NAME:-MyUnila Public Service}"
      APP_ENV: "${PUBLIC_APP_ENV:-local}"
      APP_KEY: "${PUBLIC_APP_KEY}"
      APP_DEBUG: "${PUBLIC_APP_DEBUG:-true}"
      APP_URL: "${PUBLIC_APP_URL:-http://localhost:8082}"

      # Database (map PUBLIC_DB_* to DB_*)
      DB_CONNECTION: "${PUBLIC_DB_CONNECTION:-sqlsrv}"
      DB_HOST: "${PUBLIC_DB_HOST}"
      DB_PORT: "${PUBLIC_DB_PORT:-1433}"
      DB_DATABASE: "${PUBLIC_DB_DATABASE}"
      DB_USERNAME: "${PUBLIC_DB_USERNAME}"
      DB_PASSWORD: "${PUBLIC_DB_PASSWORD}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"

      # Sister DB (same as main DB)
      SISTER_DB_HOST: "${PUBLIC_DB_HOST}"
      SISTER_DB_PORT: "${PUBLIC_DB_PORT:-1433}"
      SISTER_DB_DATABASE: "${PUBLIC_DB_DATABASE}"
      SISTER_DB_USERNAME: "${PUBLIC_DB_USERNAME}"
      SISTER_DB_PASSWORD: "${PUBLIC_DB_PASSWORD}"

      # Redis
      REDIS_HOST: "${PUBLIC_REDIS_HOST:-redis}"
      REDIS_PORT: "${PUBLIC_REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - public_storage:/var/www/storage
      - public_logs:/var/www/storage/logs
      - ../../../../backend/public-service/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    networks:
      - myunila-network
    depends_on:
      - public-service
      - redis-check
    command: >
      sh -c "
      apk add --no-cache supervisor > /dev/null 2>&1 &&
      mkdir -p /var/log/supervisor &&
      /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=public-scheduler"

  # Redis health check
  redis-check:
    image: redis:7-alpine
    container_name: myunila-redis-check-public
    command: >
      sh -c "
      until redis-cli -h redis ping; do
        echo 'Waiting for Redis...';
        sleep 2;
      done;
      echo 'Redis is ready!';
      "
    networks:
      - myunila-network
    restart: "no"

networks:
  myunila-network:
    external: true
    name: myunila-network

volumes:
  public_storage:
    driver: local
    name: myunila-public-storage
  public_logs:
    driver: local
    name: myunila-public-logs
