upstream executive_backend {
    server myunila-executive-service:9000;
    keepalive 32;
}

server {
    listen 82;  # Internal port - will be mapped to 8087 on host
    server_name _;

    # Logging - disabled for performance (enable if debugging)
    access_log off;
    error_log /var/log/nginx/executive-service-error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client settings
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Pass all requests to PHP-FPM
    location / {
        fastcgi_pass executive_backend;
        fastcgi_index index.php;

        # Always use index.php as the script
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # Pass request info to PHP-FPM
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        # FastCGI timeout settings
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # FastCGI buffer settings - optimized
        fastcgi_buffers 64 16k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Enable buffering
        fastcgi_buffering on;
        fastcgi_request_buffering off;

        # Keep connection alive to PHP-FPM
        fastcgi_keep_conn on;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
