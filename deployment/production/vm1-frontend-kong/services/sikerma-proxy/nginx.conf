# ============================================================================
# SIKERMA Proxy — VM1 nginx sidecar
# ============================================================================
# Tujuan: VM3 myunila-service ngga bisa hit sikerma.unila.ac.id langsung
# (kena Cloudflare bot challenge / TLS fingerprint discrimination).
# VM1 bisa hit langsung. Pakai VM1 sebagai HTTP-to-HTTPS proxy supaya
# TLS handshake ke Cloudflare dilakukan dari VM1 (yang accepted).
#
# Akses dari VM3 myunila-service:
#   curl http://192.168.120.41:9803/sikerma/api/v1/unit-kerja
#
# Internal network only — listen di internal IP, ACL ke 192.168.120.0/24.
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - [$time_local] "$request" '
                    'upstream=$upstream_addr status=$status '
                    'sent=$body_bytes_sent rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # DNS resolver — buat resolve sikerma.unila.ac.id
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;

    # Proxy buffering off — pass-through response apa adanya (besar JSON OK)
    proxy_buffering off;
    proxy_request_buffering off;

    # Compress / decompress kalau perlu
    gzip on;
    gzip_types application/json text/plain;

    server {
        listen 9803;
        server_name _;

        # Health check internal
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"sikerma-proxy"}';
            add_header Content-Type application/json;
        }

        # SIKERMA proxy
        # Path: /sikerma/api/v1/...  →  https://sikerma.unila.ac.id/api/v1/...
        location /sikerma/ {
            # ACL — hanya allow internal Unila + monitoring
            allow 192.168.120.0/24;   # VM internal subnet
            allow 127.0.0.1;
            allow 172.16.0.0/12;       # Docker bridge
            deny all;

            # Strip prefix "/sikerma/" supaya forward ke /api/v1/...
            rewrite ^/sikerma/(.*)$ /$1 break;

            # Browser-realistic headers (Cloudflare friendly)
            proxy_set_header Host                 sikerma.unila.ac.id;
            proxy_set_header User-Agent           "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Accept               "application/json,text/html,*/*;q=0.9";
            proxy_set_header Accept-Language      "en-US,en;q=0.9";
            proxy_set_header Accept-Encoding      "gzip, deflate, br";
            proxy_set_header Sec-Fetch-Site       "none";
            proxy_set_header Sec-Fetch-Mode       "navigate";
            proxy_set_header Sec-Fetch-Dest       "document";
            proxy_set_header Upgrade-Insecure-Requests "1";

            # Hide X-Forwarded-For supaya Cloudflare anggap traffic dari nginx VM1
            proxy_set_header X-Real-IP            "";
            proxy_set_header X-Forwarded-For      "";

            # Use IP yang resolved + force SNI
            proxy_pass https://sikerma.unila.ac.id;
            proxy_ssl_server_name on;
            proxy_ssl_name sikerma.unila.ac.id;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_ciphers HIGH:!aNULL:!MD5;
            proxy_ssl_verify off;   # Cloudflare cert valid, but skip verify untuk safety

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Forward response apa adanya
            proxy_pass_request_headers off;
            proxy_pass_request_body    on;
        }

        # Default — return 404 untuk path lain
        location / {
            return 404 '{"error":"path not found, use /sikerma/<path>"}';
            add_header Content-Type application/json;
        }
    }
}
