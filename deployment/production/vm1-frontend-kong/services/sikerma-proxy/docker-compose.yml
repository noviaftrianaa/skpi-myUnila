services:
  sikerma-proxy:
    image: nginx:alpine
    container_name: myunila-sikerma-proxy
    restart: unless-stopped

    ports:
      # Listen di internal IP VM1 saja (192.168.120.41:9803).
      # Akses dari VM3: curl http://192.168.120.41:9803/sikerma/api/v1/...
      - "192.168.120.41:9803:9803"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sikerma-proxy-logs:/var/log/nginx

    networks:
      - myunila-prod-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9803/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sikerma-proxy-logs:
    name: myunila-sikerma-proxy-logs

networks:
  myunila-prod-network:
    external: true
