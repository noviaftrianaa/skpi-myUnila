version: '3.8'

services:
  kong-postgres:
    image: postgres:15-alpine
    container_name: myunila-kong-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${KONG_PG_DATABASE}"
      POSTGRES_USER: "${KONG_PG_USER}"
      POSTGRES_PASSWORD: "${KONG_PG_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - myunila-prod-network

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_PG_USER} -d ${KONG_PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-prod-network:
    external: true

volumes:
  postgres-data:
    driver: local
