version: '3.8'

services:
  frontend:
    build:
      context: ../../../../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTH_API_URL=${NEXT_PUBLIC_AUTH_API_URL}
        - NEXT_PUBLIC_DASHBOARD_API_URL=${NEXT_PUBLIC_DASHBOARD_API_URL}
        - NEXT_PUBLIC_SISTER_API_URL=${NEXT_PUBLIC_SISTER_API_URL}
        - NEXT_PUBLIC_FEEDER_API_URL=${NEXT_PUBLIC_FEEDER_API_URL}
    image: myunila/frontend:production
    container_name: myunila-frontend-service
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_AUTH_API_URL: "${NEXT_PUBLIC_AUTH_API_URL}"
      NEXT_PUBLIC_DASHBOARD_API_URL: "${NEXT_PUBLIC_DASHBOARD_API_URL}"
      NEXT_PUBLIC_SISTER_API_URL: "${NEXT_PUBLIC_SISTER_API_URL}"
      NEXT_PUBLIC_FEEDER_API_URL: "${NEXT_PUBLIC_FEEDER_API_URL}"
      # Performance tuning for 8 CPU / 16GB RAM
      NODE_OPTIONS: "--max-old-space-size=4096"
      UV_THREADPOOL_SIZE: 16

    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G

    ports:
      - "${FRONTEND_PORT}:3000"

    networks:
      - myunila-prod-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-prod-network:
    external: true
