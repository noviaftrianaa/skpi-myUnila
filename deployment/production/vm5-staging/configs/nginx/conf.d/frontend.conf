server {
    listen 83;
    server_name _;

    # Gzip untuk semua response
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/x-javascript
               text/javascript image/svg+xml font/truetype
               font/opentype application/vnd.ms-fontobject;

    # Next.js static chunks — cache aggressive
    location /_next/static/ {
        proxy_pass http://myunila-frontend-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache 1 tahun (immutable, hash-based filenames)
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Static assets (images, fonts, dll)
    location /assets/ {
        proxy_pass http://myunila-frontend-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Semua request lainnya ke Next.js
    location / {
        proxy_pass http://myunila-frontend-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer — penting untuk WireGuard MTU
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
