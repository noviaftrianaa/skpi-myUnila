server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/auth-service-access.log;
    error_log /var/log/nginx/auth-service-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client settings
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 180s;
    client_header_timeout 180s;
    send_timeout 180s;
    keepalive_timeout 65s;

    location / {
        fastcgi_pass myunila-auth-staging:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        fastcgi_connect_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        fastcgi_buffering on;
        fastcgi_request_buffering off;
    }

    # Gateway proxy: /gateway/{service}/... → Kong :9800/{service}/...
    # Used by kong-admin portal to access API docs via /gateway/ws-service/docs etc.
    location /gateway/ {
        proxy_pass http://myunila-kong-staging:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass cookies (needed for JWT token on docs pages)
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
