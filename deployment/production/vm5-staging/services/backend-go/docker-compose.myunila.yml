services:
  myunila-service:
    build:
      context: ../../../../../backend/myunila-service
      dockerfile: Dockerfile
    image: myunila/myunila-service:staging
    container_name: myunila-myunila-staging
    ports:
      - "8086:8086"
    environment:
      # App Configuration
      APP_NAME: ${MYUNILA_APP_NAME:-MyUnila Service}
      APP_PORT: ${MYUNILA_APP_PORT:-:8086}
      APP_ENV: ${MYUNILA_APP_ENV:-staging}

      # Database Configuration
      DB_DRIVER: ${MYUNILA_DB_DRIVER:-sqlserver}
      DB_HOST: ${MYUNILA_DB_HOST:-${SISTER_DB_HOST}}
      DB_PORT: ${MYUNILA_DB_PORT:-${SISTER_DB_PORT:-1433}}
      DB_USERNAME: ${MYUNILA_DB_USERNAME:-${SISTER_DB_USERNAME}}
      DB_PASSWORD: ${MYUNILA_DB_PASSWORD:-${SISTER_DB_PASSWORD}}
      DB_DATABASE: ${MYUNILA_DB_DATABASE:-${SISTER_DB_DATABASE}}
      DB_TRUST_SERVER_CERTIFICATE: "true"

      # SIKEP API Configuration
      SIKEP_API_BASE_URL: ${SIKEP_API_BASE_URL:-https://sikep.unila.ac.id/2022/api/v1}
      SIKEP_API_USERNAME: ${SIKEP_API_USERNAME}
      SIKEP_API_PASSWORD: ${SIKEP_API_PASSWORD}

      # Radius API Configuration (SSO Unila)
      RADIUS_API_BASE_URL: ${RADIUS_API_BASE_URL:-https://akses.unila.ac.id/api/live/v1}
      RADIUS_API_APP_KEY: ${RADIUS_API_APP_KEY}
      RADIUS_API_USERNAME: ${RADIUS_API_USERNAME}

      # Encryption Key
      API_CONFIG_ENCRYPTION_KEY: ${API_CONFIG_ENCRYPTION_KEY}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Go runtime (reduced for staging)
      GOMAXPROCS: 2

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    networks:
      - myunila-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=myunila,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
