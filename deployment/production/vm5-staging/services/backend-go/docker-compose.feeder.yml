version: '3.8'

services:
  feeder-service:
    build:
      context: ../../../../../backend/feeder-service
      dockerfile: Dockerfile
    image: myunila/feeder-service:staging
    container_name: myunila-feeder-staging
    ports:
      - "8084:8084"
    environment:
      # App Configuration
      APP_NAME: ${FEEDER_APP_NAME:-Feeder Service}
      APP_PORT: ${FEEDER_APP_PORT:-:8084}
      APP_ENV: ${FEEDER_APP_ENV:-staging}

      # Database Configuration
      DB_DRIVER: ${FEEDER_DB_DRIVER:-sqlserver}
      DB_HOST: ${FEEDER_DB_HOST}
      DB_PORT: ${FEEDER_DB_PORT:-1433}
      DB_USERNAME: ${FEEDER_DB_USERNAME}
      DB_PASSWORD: ${FEEDER_DB_PASSWORD}
      DB_DATABASE: ${FEEDER_DB_DATABASE}
      DB_TRUST_SERVER_CERTIFICATE: ${FEEDER_DB_TRUST_SERVER_CERTIFICATE:-true}
      # Database connection pool (tuned down for staging)
      DB_MAX_OPEN_CONNS: ${FEEDER_DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${FEEDER_DB_MAX_IDLE_CONNS:-3}
      DB_CONN_MAX_LIFETIME: ${FEEDER_DB_CONN_MAX_LIFETIME:-5m}
      # Go runtime (reduced for staging)
      GOMAXPROCS: 2
      GOGC: 100

      # Feeder API Configuration
      FEEDER_API_BASE_URL: ${FEEDER_API_BASE_URL}
      FEEDER_API_USERNAME: ${FEEDER_API_USERNAME}
      FEEDER_API_PASSWORD: ${FEEDER_API_PASSWORD}

      # Encryption Key
      API_CONFIG_ENCRYPTION_KEY: ${API_CONFIG_ENCRYPTION_KEY}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - myunila-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=feeder,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
