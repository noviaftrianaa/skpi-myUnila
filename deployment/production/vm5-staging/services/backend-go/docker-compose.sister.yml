version: '3.8'

services:
  sister-service:
    build:
      context: ../../../../../backend/sister-service
      dockerfile: Dockerfile
    image: myunila/sister-service:staging
    container_name: myunila-sister-staging
    ports:
      - "8083:8083"
    environment:
      # App Configuration
      APP_NAME: ${SISTER_APP_NAME:-Sister Service}
      APP_PORT: ${SISTER_APP_PORT:-:8083}
      APP_ENV: ${SISTER_APP_ENV:-staging}

      # Database Configuration
      DB_DRIVER: ${SISTER_DB_DRIVER:-sqlserver}
      DB_HOST: ${SISTER_DB_HOST}
      DB_PORT: ${SISTER_DB_PORT:-1433}
      DB_USERNAME: ${SISTER_DB_USERNAME}
      DB_PASSWORD: ${SISTER_DB_PASSWORD}
      DB_DATABASE: ${SISTER_DB_DATABASE}
      # Database connection pool (tuned down for staging)
      DB_MAX_OPEN_CONNS: ${SISTER_DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${SISTER_DB_MAX_IDLE_CONNS:-3}
      DB_CONN_MAX_LIFETIME: ${SISTER_DB_CONN_MAX_LIFETIME:-5m}
      # Go runtime (reduced for staging)
      GOMAXPROCS: 2
      GOGC: 100

      # SISTER API Configuration
      SISTER_API_BASE_URL: ${SISTER_API_BASE_URL}
      SISTER_API_IDPENGGUNA: ${SISTER_API_IDPENGGUNA}
      SISTER_API_USERNAME: ${SISTER_API_USERNAME}
      SISTER_API_PASSWORD: ${SISTER_API_PASSWORD}

      # Encryption Key
      API_CONFIG_ENCRYPTION_KEY: ${API_CONFIG_ENCRYPTION_KEY}

      # Laravel APP_KEY
      LARAVEL_APP_KEY: ${LARAVEL_APP_KEY}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # MinIO Object Storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-192.168.120.47:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-myunila-storage}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://192.168.120.47:9000}

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - myunila-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=sister,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
