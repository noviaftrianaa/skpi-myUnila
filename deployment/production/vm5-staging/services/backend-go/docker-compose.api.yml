version: '3.8'

services:
  ws-service:
    build:
      context: ../../../../../backend/api-service
      dockerfile: Dockerfile
      args:
        - APP_ENV=staging
    image: myunila/ws-service:staging
    container_name: myunila-ws-staging
    ports:
      - "8085:8085"
    env_file:
      - ../../.env
    environment:
      APP_NAME: "${API_APP_NAME:-MyUnila API Service}"
      APP_PORT: ":8085"
      APP_ENV: staging
      APP_URL: "${API_APP_URL:-http://192.168.120.45:8085}"

      # Database (SQL Server)
      DB_DRIVER: sqlserver
      DB_HOST: "${API_DB_HOST}"
      DB_PORT: "${API_DB_PORT:-1433}"
      DB_DATABASE: "${API_DB_DATABASE}"
      DB_USERNAME: "${API_DB_USERNAME}"
      DB_PASSWORD: "${API_DB_PASSWORD}"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_MAX_OPEN_CONNS: "10"
      DB_MAX_IDLE_CONNS: "3"
      DB_CONN_MAX_LIFETIME: "5m"

      # Redis Configuration (local container)
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${API_REDIS_DB:-2}"

      # JWT Configuration
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGO: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-900}"
      JWT_ISSUER: "${JWT_ISSUER:-http://192.168.120.45}"

      # Auth Cache Prefix
      AUTH_CACHE_PREFIX: "${AUTH_CACHE_PREFIX:-auth_}"

      # Go runtime (reduced for staging)
      GOMAXPROCS: 2

      TZ: "${TIMEZONE:-Asia/Jakarta}"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    networks:
      - myunila-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
