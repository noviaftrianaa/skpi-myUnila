version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: myunila-nginx-staging
    env_file:
      - ../../.env
    ports:
      - "${NGINX_AUTH_PORT:-8081}:80"
      - "${NGINX_PUBLIC_PORT:-8082}:81"
      - "${NGINX_DASHBOARD_PORT:-8086}:82"
    volumes:
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../configs/nginx/conf.d:/etc/nginx/conf.d:ro

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    networks:
      - myunila-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
