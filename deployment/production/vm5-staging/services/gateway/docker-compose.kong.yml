version: '3.8'

services:
  kong-migrations:
    image: kong:3.4
    container_name: myunila-kong-migrations-staging
    command: kong migrations bootstrap
    restart: on-failure

    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: "${KONG_PG_HOST:-myunila-kong-postgres-staging}"
      KONG_PG_PORT: "${KONG_PG_PORT:-5432}"
      KONG_PG_DATABASE: "${KONG_PG_DATABASE}"
      KONG_PG_USER: "${KONG_PG_USER}"
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD}"

    networks:
      - myunila-staging-network

  kong:
    image: kong:3.4
    container_name: myunila-kong-staging
    restart: unless-stopped

    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: "${KONG_PG_HOST:-myunila-kong-postgres-staging}"
      KONG_PG_PORT: "${KONG_PG_PORT:-5432}"
      KONG_PG_DATABASE: "${KONG_PG_DATABASE}"
      KONG_PG_USER: "${KONG_PG_USER}"
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # Performance tuning (reduced for staging - single VM)
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_NGINX_WORKER_CONNECTIONS: "2048"
      KONG_MEM_CACHE_SIZE: "64m"
      KONG_PROXY_LISTEN_BACKLOG: "4096"
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: "32"
      KONG_UPSTREAM_KEEPALIVE_MAX_REQUESTS: "500"
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: "60"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_ADMIN_PORT}:8001"

    networks:
      - myunila-staging-network

    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

    depends_on:
      - kong-migrations

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network
