version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: myunila-meilisearch-staging
    env_file:
      - ../../.env
    restart: unless-stopped
    ports:
      - "7700:7700"

    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_KEY:-masterKey123456}"
      MEILI_ENV: "${MEILISEARCH_ENV:-development}"
      MEILI_HTTP_ADDR: "0.0.0.0:7700"

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    volumes:
      - meilisearch_data:/meili_data
    networks:
      - myunila-staging-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=meilisearch,vm=vm5-staging"

networks:
  myunila-staging-network:
    external: true
    name: myunila-staging-network

volumes:
  meilisearch_data:
    driver: local
    name: myunila-meilisearch-data-staging
