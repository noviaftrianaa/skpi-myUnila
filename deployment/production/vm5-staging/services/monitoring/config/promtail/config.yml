server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://myunila-loki-staging:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - semua container myunila staging
  - job_name: docker-staging
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["myunila-"]
    relabel_configs:
      # Hanya container nama myunila-*
      - source_labels: ['__meta_docker_container_name']
        regex: '/myunila-.*'
        action: keep
      # Ambil nama container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
        replacement: '$1'
      # Nama service dari compose label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # VM label
      - target_label: 'vm'
        replacement: 'vm5-staging'
      # Environment label
      - target_label: 'environment'
        replacement: 'staging'
    pipeline_stages:
      - docker: {}

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          vm: vm5-staging
          environment: staging
          __path__: /var/log/syslog
