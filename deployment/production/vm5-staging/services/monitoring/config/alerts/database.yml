groups:
  - name: myunila.database
    interval: 30s
    rules:
      # Alert jika semua backend service yang konek ke DB serentak down
      # Ini indikasi kuat DB 119 bermasalah
      - alert: DatabaseServerDown
        expr: |
          (
            count(up{job=~"auth-service|sister-service|api-service|keuangan-service|feeder-service"} == 0) 
            / 
            count(up{job=~"auth-service|sister-service|api-service|keuangan-service|feeder-service"})
          ) > 0.5
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "🔴 DATABASE SERVER KEMUNGKINAN DOWN!"
          description: |
            Lebih dari 50% backend services gagal health check serentak.
            Kemungkinan besar DB Server 192.168.123.119 tidak bisa diakses.
            
            TINDAKAN SEGERA:
            1. Cek koneksi ke DB 119 via SSMS
            2. Jika 119 confirmed DOWN, jalankan failover:
               - SSMS 190: RESTORE DATABASE pdut WITH RECOVERY
               - Ansible: ansible-playbook db-failover.yml --extra-vars "db_host=192.168.123.190"
            
            Services down: {{ $value | humanizePercentage }}

      # Alert jika ada service yang restart berkali-kali (bisa karena DB timeout)
      - alert: DatabaseConnectionIssue
        expr: |
          increase(container_start_time_seconds{name=~"myunila-(auth|sister|api|keuangan|feeder)-.*"}[10m]) > 2
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "⚠️ {{ $labels.name }} restart loop — kemungkinan DB connection issue"
          description: |
            Container {{ $labels.name }} restart {{ $value }}x dalam 10 menit.
            Cek koneksi database 192.168.123.119.
