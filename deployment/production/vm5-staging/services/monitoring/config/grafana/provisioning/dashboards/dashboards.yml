apiVersion: 1

providers:
  - name: 'MyUnila Dashboards'
    orgId: 1
    folder: 'MyUnila'
    folderUid: 'myunila'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
