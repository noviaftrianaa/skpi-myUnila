version: '3.8'

services:
  frontend:
    build:
      context: ../../../../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTH_API_URL=${NEXT_PUBLIC_AUTH_API_URL}
        - NEXT_PUBLIC_PUBLIC_API_URL=${NEXT_PUBLIC_PUBLIC_API_URL}
        - NEXT_PUBLIC_SISTER_API_URL=${NEXT_PUBLIC_SISTER_API_URL}
        - NEXT_PUBLIC_FEEDER_API_URL=${NEXT_PUBLIC_FEEDER_API_URL}
        - NEXT_PUBLIC_MYUNILA_API_URL=${NEXT_PUBLIC_MYUNILA_API_URL}
        - NEXT_PUBLIC_DASHBOARD_API_URL=${NEXT_PUBLIC_DASHBOARD_API_URL}
        - NEXT_PUBLIC_ONEDATA_API_URL=${NEXT_PUBLIC_ONEDATA_API_URL}
        - NEXT_PUBLIC_WEBMON_API_URL=${NEXT_PUBLIC_WEBMON_API_URL}
        - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL}
        - NEXT_PUBLIC_PROMETHEUS_URL=${NEXT_PUBLIC_PROMETHEUS_URL}
        - NEXT_PUBLIC_LOKI_URL=${NEXT_PUBLIC_LOKI_URL}
        - NEXT_PUBLIC_CADVISOR_URL=${NEXT_PUBLIC_CADVISOR_URL}
        - NEXT_PUBLIC_KEUANGAN_API_URL=${NEXT_PUBLIC_KEUANGAN_API_URL}
        - NEXT_PUBLIC_PROJECT_API_URL=${NEXT_PUBLIC_PROJECT_API_URL}
        - NEXT_PUBLIC_BAK_API_URL=${NEXT_PUBLIC_BAK_API_URL}
        - NEXT_PUBLIC_MAN_KONTEN_API_URL=${NEXT_PUBLIC_MAN_KONTEN_API_URL}
        - NEXT_PUBLIC_SI_PRESTASI_API_URL=${NEXT_PUBLIC_SI_PRESTASI_API_URL}
        - NEXT_PUBLIC_EXECUTIVE_API_URL=${NEXT_PUBLIC_EXECUTIVE_API_URL}
        - MINIO_STORAGE_URL=${MINIO_STORAGE_URL:-http://192.168.120.47:9000}
    image: myunila/frontend:staging
    container_name: myunila-frontend-staging
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_AUTH_API_URL: "${NEXT_PUBLIC_AUTH_API_URL}"
      NEXT_PUBLIC_PUBLIC_API_URL: "${NEXT_PUBLIC_PUBLIC_API_URL}"
      NEXT_PUBLIC_SISTER_API_URL: "${NEXT_PUBLIC_SISTER_API_URL}"
      NEXT_PUBLIC_FEEDER_API_URL: "${NEXT_PUBLIC_FEEDER_API_URL}"
      NEXT_PUBLIC_MYUNILA_API_URL: "${NEXT_PUBLIC_MYUNILA_API_URL}"
      NEXT_PUBLIC_DASHBOARD_API_URL: "${NEXT_PUBLIC_DASHBOARD_API_URL}"
      NEXT_PUBLIC_ONEDATA_API_URL: "${NEXT_PUBLIC_ONEDATA_API_URL}"
      NEXT_PUBLIC_WEBMON_API_URL: "${NEXT_PUBLIC_WEBMON_API_URL}"
      NEXT_PUBLIC_GRAFANA_URL: "${NEXT_PUBLIC_GRAFANA_URL}"
      NEXT_PUBLIC_PROMETHEUS_URL: "${NEXT_PUBLIC_PROMETHEUS_URL}"
      NEXT_PUBLIC_LOKI_URL: "${NEXT_PUBLIC_LOKI_URL}"
      NEXT_PUBLIC_CADVISOR_URL: "${NEXT_PUBLIC_CADVISOR_URL}"
      NEXT_PUBLIC_KEUANGAN_API_URL: "${NEXT_PUBLIC_KEUANGAN_API_URL}"
      NEXT_PUBLIC_PROJECT_API_URL: "${NEXT_PUBLIC_PROJECT_API_URL}"
      NEXT_PUBLIC_BAK_API_URL: "${NEXT_PUBLIC_BAK_API_URL}"
      NEXT_PUBLIC_MAN_KONTEN_API_URL: "${NEXT_PUBLIC_MAN_KONTEN_API_URL}"
      NEXT_PUBLIC_SI_PRESTASI_API_URL: "${NEXT_PUBLIC_SI_PRESTASI_API_URL}"
      NEXT_PUBLIC_EXECUTIVE_API_URL: "${NEXT_PUBLIC_EXECUTIVE_API_URL}"
      # MinIO rewrite upstream — Next.js proxy /myunila-storage/* ke MinIO real IP
      MINIO_STORAGE_URL: "${MINIO_STORAGE_URL:-http://192.168.120.47:9000}"
      # Performance tuning (reduced for staging)
      NODE_OPTIONS: "--max-old-space-size=1024"
      UV_THREADPOOL_SIZE: 4

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M

    ports:
      - "${FRONTEND_PORT}:3000"

    networks:
      - myunila-staging-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-staging-network:
    external: true
