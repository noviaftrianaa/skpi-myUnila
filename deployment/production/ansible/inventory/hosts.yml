---
# MyUnila Production Inventory
# 7 VM Ubuntu Fresh Install

all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    timezone: Asia/Jakarta
    docker_version: "24.0"
    docker_compose_version: "2.23.0"

  children:
    # VM1 - Frontend & Kong Gateway
    frontend:
      hosts:
        vm1-frontend:
          ansible_host: 192.168.120.41
          ansible_user: myfrontend
          ansible_connection: local
          vm_role: frontend_gateway
          services:
            - kong
            - frontend
            - redis
            - postgres

    # VM2 - Backend Services 1 (Dashboard + Auth)
    backend1:
      hosts:
        vm2-backend1:
          ansible_host: 192.168.120.42
          ansible_user: mybackend
          vm_role: backend_core
          services:
            - dashboard-service
            - auth-service
            - nginx

    # VM3 - Backend Services 2 (Sister + Scheduler)
    backend2:
      hosts:
        vm3-backend2:
          ansible_host: 192.168.120.43
          ansible_user: mybackend2
          vm_role: backend_scheduler
          services:
            - sister-service
            - feeder-service
            - scheduler

    # VM4 - Monitoring & Load Balancer
    monitoring:
      hosts:
        vm4-loadbalancer:
          ansible_host: 192.168.120.44
          ansible_user: mybalancer
          vm_role: monitoring
          services:
            - grafana
            - prometheus
            - loki
            - nginx-lb

    # VM5 - Staging Environment
    staging:
      hosts:
        vm5-staging:
          ansible_host: 192.168.120.45
          ansible_user: mystagging
          vm_role: staging
          services:
            - all-services

    # VM6 - Replica/Backup
    replica:
      hosts:
        vm6-replica:
          ansible_host: 192.168.120.46
          ansible_user: myreplica
          vm_role: replica
          services:
            - replica-services

    # VM7 - Document Handler
    document:
      hosts:
        vm7-document:
          ansible_host: 192.168.120.47
          ansible_user: mydocument
          vm_role: document_handler
          services:
            - document-service
            - file-storage

    # Group untuk VM yang butuh Docker
    docker_hosts:
      children:
        frontend:
        backend1:
        backend2:
        monitoring:
        staging:
        replica:
        document:

    # Group untuk VM production aktif (exclude staging/replica)
    production:
      children:
        frontend:
        backend1:
        backend2:
        monitoring:
        document:
