---
# Playbook: Rebuild All Production Services
# Description: Rebuild and restart all services across VM1, VM2, VM3 after code/config changes
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/rebuild-all-services.yml
#
# This playbook:
# 1. Pulls latest code from git
# 2. Rebuilds Docker images with --no-cache
# 3. Restarts services with new configurations
# 4. Verifies services are healthy
#
# Services are rebuilt in parallel across VMs for faster deployment.

- name: Rebuild All Production Services
  hosts: all
  become: yes
  gather_facts: yes
  serial: 100%  # Process all hosts in parallel

  vars:
    app_dir: "/var/www/my-unila"
    branch: "master"

  tasks:
    - name: Display deployment information
      debug:
        msg: |
          ============================================
          Rebuilding services on {{ inventory_hostname }}
          VM: {{ inventory_hostname }}
          User: {{ ansible_user }}
          ============================================
      run_once: false

    - name: Pull latest code from git
      shell: git pull origin {{ branch }}
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ ansible_user }}"
      register: git_pull_result
      changed_when: "'Already up to date' not in git_pull_result.stdout"

    - name: Display git pull result
      debug:
        msg: "{{ git_pull_result.stdout_lines }}"
      when: git_pull_result.stdout_lines is defined

# ============================================
# VM1 - Frontend & Kong Gateway
# ============================================
- name: Rebuild VM1 - Frontend & Kong Gateway
  hosts: frontend
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm1-frontend-kong"

  tasks:
    - name: Restart Kong Gateway (pickup new environment variables)
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/kong/docker-compose.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: kong_restart

    - name: Wait for Kong to be healthy
      wait_for:
        host: localhost
        port: 9800
        delay: 5
        timeout: 60

    - name: Rebuild Frontend image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: frontend_build

    - name: Restart Frontend service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Frontend to be healthy
      wait_for:
        host: localhost
        port: 3000
        delay: 5
        timeout: 60

    - name: Verify VM1 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm1_status
      become_user: "{{ ansible_user }}"

    - name: Display VM1 services status
      debug:
        msg: "{{ vm1_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM1
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm1_cleanup

    - name: Display VM1 cleanup result
      debug:
        msg: "{{ vm1_cleanup.stdout_lines }}"

# ============================================
# VM2 - Backend PHP Services & Infrastructure
# ============================================
- name: Rebuild VM2 - Backend PHP Services
  hosts: backend1
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm2-backend1"

  tasks:
    - name: Rebuild Public Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/public/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: public_build

    - name: Rebuild Auth Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/auth/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: auth_build

    - name: Restart Public Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/public/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Auth Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/auth/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Clear Laravel caches for Auth Service
      shell: |
        docker exec myunila-auth-service php artisan config:clear 2>/dev/null || true
        docker exec myunila-auth-service php artisan route:clear 2>/dev/null || true
        docker exec myunila-auth-service php artisan cache:clear 2>/dev/null || true
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Start queue worker for Auth Service (background sync jobs)
      shell: |
        docker exec -d myunila-auth-service sh -c "nohup php artisan queue:work redis --tries=3 --timeout=1800 --memory=256 > /var/www/storage/logs/queue-worker.log 2>&1 &"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Verify queue worker is running
      shell: |
        docker exec myunila-auth-service ps aux | grep -q "queue:work" && echo "Queue worker is running" || echo "Queue worker NOT running"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: queue_worker_status
      ignore_errors: yes

    - name: Display queue worker status
      debug:
        msg: "{{ queue_worker_status.stdout }}"
      when: queue_worker_status is defined

    - name: Restart Nginx (pickup new config)
      shell: |
        cd {{ deployment_dir }}
        docker compose -f services/nginx/docker-compose.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for services to be healthy
      pause:
        seconds: 10

    - name: Verify VM2 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm2_status
      become_user: "{{ ansible_user }}"

    - name: Display VM2 services status
      debug:
        msg: "{{ vm2_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM2
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm2_cleanup

    - name: Display VM2 cleanup result
      debug:
        msg: "{{ vm2_cleanup.stdout_lines }}"

# ============================================
# VM3 - Backend Services 2 (Sister + Feeder + MyUnila)
# ============================================
- name: Rebuild VM3 - Sister, Feeder & MyUnila Services
  hosts: backend2
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm3-backend2"

  tasks:
    - name: Rebuild Sister Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/sister/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: sister_build

    - name: Restart Sister Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/sister/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Sister Service to be healthy
      wait_for:
        host: localhost
        port: 8083
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Feeder Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Feeder Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/feeder/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: feeder_build

    - name: Restart Feeder Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/feeder/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Feeder Service to be healthy
      wait_for:
        host: localhost
        port: 8084
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for MyUnila Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild MyUnila Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/myunila/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: myunila_build

    - name: Restart MyUnila Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/myunila/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for MyUnila Service to be healthy
      wait_for:
        host: localhost
        port: 8086
        delay: 5
        timeout: 60

    - name: Verify VM3 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm3_status
      become_user: "{{ ansible_user }}"

    - name: Display VM3 services status
      debug:
        msg: "{{ vm3_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM3
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm3_cleanup

    - name: Display VM3 cleanup result
      debug:
        msg: "{{ vm3_cleanup.stdout_lines }}"

# ============================================
# Final Summary
# ============================================
- name: Display Deployment Summary
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: Show deployment summary
      debug:
        msg: |
          ============================================
          Deployment Complete!
          ============================================

          All services have been rebuilt and restarted.
          Docker cleanup completed on all VMs:
          - Removed unused containers
          - Removed dangling images (older than 24h)
          - Removed unused volumes
          - Cleaned build cache

          Next steps:
          1. Verify services are running: docker ps
          2. Check logs if needed: docker logs <container-name>
          3. Test endpoints via Kong Gateway

          Access Points:
          - Frontend:    http://192.168.120.41:3000
          - Kong Proxy:  http://192.168.120.41:9800
          - Kong Admin:  http://192.168.120.41:9801

          Backend services (via Kong):
          - Public:      http://192.168.120.41:9800/public-service/api/health
          - Auth:        http://192.168.120.41:9800/auth-service/api/health
          - Sister:      http://192.168.120.41:9800/sister-service/health
          - Feeder:      http://192.168.120.41:9800/feeder-service/health
          - MyUnila:     http://192.168.120.41:9800/myunila-service/health
