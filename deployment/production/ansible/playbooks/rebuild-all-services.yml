---
# Playbook: Rebuild All Production Services
# Description: Rebuild and restart all services across VM1, VM2, VM3 after code/config changes
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/rebuild-all-services.yml
#
# This playbook:
# 1. Pulls latest code from git
# 2. Rebuilds Docker images with --no-cache
# 3. Restarts services with new configurations
# 4. Verifies services are healthy
#
# Services are rebuilt in parallel across VMs for faster deployment.

- name: Rebuild All Production Services
  hosts: all
  become: yes
  gather_facts: yes
  serial: 100%  # Process all hosts in parallel

  vars:
    app_dir: "/var/www/my-unila"
    branch: "master"

  tasks:
    - name: Display deployment information
      debug:
        msg: |
          ============================================
          Rebuilding services on {{ inventory_hostname }}
          VM: {{ inventory_hostname }}
          User: {{ ansible_user }}
          ============================================
      run_once: false

    - name: Pull latest code from git
      shell: git pull origin {{ branch }}
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ ansible_user }}"
      register: git_pull_result
      changed_when: "'Already up to date' not in git_pull_result.stdout"

    - name: Display git pull result
      debug:
        msg: "{{ git_pull_result.stdout_lines }}"
      when: git_pull_result.stdout_lines is defined

# ============================================
# VM1 - Frontend & Kong Gateway
# ============================================
- name: Rebuild VM1 - Frontend & Kong Gateway
  hosts: frontend
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm1-frontend-kong"

  tasks:
    - name: Restart Kong Gateway (pickup new environment variables)
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/kong/docker-compose.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: kong_restart

    - name: Wait for Kong to be healthy
      wait_for:
        host: localhost
        port: 9800
        delay: 5
        timeout: 60

    - name: Setup Kong routes (services, routes, plugins)
      shell: |
        cd {{ deployment_dir }}/scripts
        bash setup-kong-routes.sh
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: kong_routes_setup

    - name: Display Kong routes setup result
      debug:
        msg: "{{ kong_routes_setup.stdout_lines[-20:] }}"
      when: kong_routes_setup.stdout_lines is defined

    - name: Rebuild Frontend image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: frontend_build

    - name: Restart Frontend service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Frontend to be healthy
      wait_for:
        host: localhost
        port: 3000
        delay: 5
        timeout: 60

    - name: Verify VM1 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm1_status
      become_user: "{{ ansible_user }}"

    - name: Display VM1 services status
      debug:
        msg: "{{ vm1_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM1
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm1_cleanup

    - name: Display VM1 cleanup result
      debug:
        msg: "{{ vm1_cleanup.stdout_lines }}"

# ============================================
# VM2 - Backend PHP Services & Infrastructure
# ============================================
- name: Rebuild VM2 - Backend PHP Services
  hosts: backend1
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm2-backend1"

  tasks:
    - name: Rebuild Public Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/public/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: public_build

    - name: Rebuild Auth Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/auth/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: auth_build

    - name: Restart Public Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/public/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Auth Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/auth/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Clear Laravel caches for Auth Service
      shell: |
        docker exec myunila-auth-service php artisan config:clear 2>/dev/null || true
        docker exec myunila-auth-service php artisan route:clear 2>/dev/null || true
        docker exec myunila-auth-service php artisan cache:clear 2>/dev/null || true
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Generate API documentation for Public Service
      shell: |
        docker exec myunila-public-service php artisan l5-swagger:generate 2>/dev/null || true
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes
      register: public_docs

    - name: Generate API documentation for Auth Service
      shell: |
        docker exec myunila-auth-service php artisan l5-swagger:generate 2>/dev/null || true
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes
      register: auth_docs

    - name: Display API docs generation status
      debug:
        msg: |
          Public Service docs: {{ 'Generated' if public_docs.rc == 0 else 'Failed or skipped' }}
          Auth Service docs: {{ 'Generated' if auth_docs.rc == 0 else 'Failed or skipped' }}

    - name: Start queue worker for Auth Service (background sync jobs)
      shell: |
        docker exec -d myunila-auth-service sh -c "nohup php artisan queue:work redis --tries=3 --timeout=1800 --memory=256 > /var/www/storage/logs/queue-worker.log 2>&1 &"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Verify queue worker is running
      shell: |
        docker exec myunila-auth-service ps aux | grep -q "queue:work" && echo "Queue worker is running" || echo "Queue worker NOT running"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: queue_worker_status
      ignore_errors: yes

    - name: Display queue worker status
      debug:
        msg: "{{ queue_worker_status.stdout }}"
      when: queue_worker_status is defined

    - name: Restart Nginx (pickup new config)
      shell: |
        cd {{ deployment_dir }}
        docker compose -f services/nginx/docker-compose.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for services to be healthy
      pause:
        seconds: 10

    - name: Verify VM2 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm2_status
      become_user: "{{ ansible_user }}"

    - name: Display VM2 services status
      debug:
        msg: "{{ vm2_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM2
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm2_cleanup

    - name: Display VM2 cleanup result
      debug:
        msg: "{{ vm2_cleanup.stdout_lines }}"

# ============================================
# VM3 - Backend Services 2 (Sister + Feeder + MyUnila + Keuangan + API + Monitoring)
# ============================================
- name: Rebuild VM3 - All Backend2 Services
  hosts: backend2
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm3-backend2"

  tasks:
    - name: Rebuild Sister Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/sister/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: sister_build

    - name: Restart Sister Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/sister/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Sister Service to be healthy
      wait_for:
        host: localhost
        port: 8083
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Feeder Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Feeder Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/feeder/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: feeder_build

    - name: Restart Feeder Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/feeder/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Feeder Service to be healthy
      wait_for:
        host: localhost
        port: 8084
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for MyUnila Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild MyUnila Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/myunila/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: myunila_build

    - name: Restart MyUnila Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/myunila/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for MyUnila Service to be healthy
      wait_for:
        host: localhost
        port: 8086
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Keuangan Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Keuangan Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/keuangan/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: keuangan_build

    - name: Restart Keuangan Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/keuangan/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Keuangan Service to be healthy
      wait_for:
        host: localhost
        port: 8088
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for API Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild API Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/api/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: api_build

    - name: Restart API Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/api/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for API Service to be healthy
      wait_for:
        host: localhost
        port: 8085
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Monitoring Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Monitoring Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/monitoring/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: monitoring_build

    - name: Restart Monitoring Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/monitoring/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Monitoring Service to be healthy
      wait_for:
        host: localhost
        port: 8089
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Project Service
      shell: |
        docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Check if Project Service docker-compose exists
      stat:
        path: "{{ deployment_dir }}/services/project/docker-compose.yml"
      register: project_compose

    - name: Rebuild Project Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/project/docker-compose.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: project_build
      when: project_compose.stat.exists

    - name: Restart Project Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/project/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      when: project_compose.stat.exists

    - name: Wait for Project Service to be healthy
      wait_for:
        host: localhost
        port: 8095
        delay: 5
        timeout: 60
      when: project_compose.stat.exists

    - name: Verify VM3 services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm3_status
      become_user: "{{ ansible_user }}"

    - name: Display VM3 services status
      debug:
        msg: "{{ vm3_status.stdout_lines }}"

    - name: Clean up unused Docker images and containers on VM3
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm3_cleanup

    - name: Display VM3 cleanup result
      debug:
        msg: "{{ vm3_cleanup.stdout_lines }}"

# ============================================
# VM5 - Staging (All Services in 1 VM)
# ============================================
- name: Rebuild VM5 - Staging All Services
  hosts: staging
  become: yes
  gather_facts: no

  vars:
    app_dir: "/var/www/my-unila"
    deployment_dir: "{{ app_dir }}/deployment/production/vm5-staging"

  tasks:
    # --- Infrastructure ---
    - name: Restart Infrastructure (PostgreSQL, Redis, Meilisearch)
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/infrastructure/docker-compose.postgres.yml restart
        docker compose --env-file .env -f services/infrastructure/docker-compose.redis.yml restart
        docker compose --env-file .env -f services/infrastructure/docker-compose.meilisearch.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for infrastructure to be ready
      pause:
        seconds: 10

    # --- Kong Gateway ---
    - name: Restart Kong Gateway
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/gateway/docker-compose.kong.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Kong to be healthy
      wait_for:
        host: localhost
        port: 9800
        delay: 5
        timeout: 60

    - name: Setup Kong routes
      shell: |
        cd {{ deployment_dir }}/scripts
        bash setup-kong-routes.sh
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: staging_kong_routes

    - name: Display Kong routes result
      debug:
        msg: "{{ staging_kong_routes.stdout_lines[-10:] }}"
      when: staging_kong_routes.stdout_lines is defined

    # --- Backend PHP Services ---
    - name: Rebuild Auth Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-php/docker-compose.auth.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Dashboard Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-php/docker-compose.dashboard.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Public Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-php/docker-compose.public.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart PHP Services
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-php/docker-compose.auth.yml up -d
        docker compose --env-file .env -f services/backend-php/docker-compose.dashboard.yml up -d
        docker compose --env-file .env -f services/backend-php/docker-compose.public.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Clear Laravel caches (Auth Service)
      shell: |
        docker exec myunila-auth-staging php artisan config:clear 2>/dev/null || true
        docker exec myunila-auth-staging php artisan route:clear 2>/dev/null || true
        docker exec myunila-auth-staging php artisan cache:clear 2>/dev/null || true
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Restart Nginx
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-php/docker-compose.nginx.yml restart
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for PHP services via Nginx
      wait_for:
        host: localhost
        port: 8081
        delay: 5
        timeout: 60

    # --- Backend Go Services ---
    - name: Clean Docker build cache
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Sister Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.sister.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Sister Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.sister.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Sister Service
      wait_for:
        host: localhost
        port: 8083
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Feeder
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Feeder Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.feeder.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Feeder Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.feeder.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Feeder Service
      wait_for:
        host: localhost
        port: 8084
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for MyUnila
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild MyUnila Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.myunila.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart MyUnila Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.myunila.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for MyUnila Service
      wait_for:
        host: localhost
        port: 8086
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Keuangan
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Keuangan Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.keuangan.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Keuangan Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.keuangan.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Keuangan Service
      wait_for:
        host: localhost
        port: 8088
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for API
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild API Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.api.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart API Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.api.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for API Service
      wait_for:
        host: localhost
        port: 8085
        delay: 5
        timeout: 60

    - name: Clean Docker build cache for Monitoring
      shell: docker builder prune -af --filter "label!=keep"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Rebuild Monitoring Service image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.monitoring.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Monitoring Service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/backend-go/docker-compose.monitoring.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Monitoring Service
      wait_for:
        host: localhost
        port: 8089
        delay: 5
        timeout: 60

    # --- Frontend ---
    - name: Rebuild Frontend image
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.frontend.yml build --no-cache
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Restart Frontend service
      shell: |
        cd {{ deployment_dir }}
        docker compose --env-file .env -f services/frontend/docker-compose.frontend.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Frontend to be healthy
      wait_for:
        host: localhost
        port: 3000
        delay: 5
        timeout: 60

    # --- Verify & Cleanup ---
    - name: Verify VM5 Staging services status
      shell: docker ps --filter "name=staging" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: vm5_status
      become_user: "{{ ansible_user }}"

    - name: Display VM5 Staging services status
      debug:
        msg: "{{ vm5_status.stdout_lines }}"

    - name: Clean up unused Docker resources on VM5
      shell: |
        echo "Cleaning up unused Docker resources..."
        docker container prune -f
        docker image prune -af --filter "until=24h"
        docker volume prune -f
        docker builder prune -af --filter "until=24h"
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"
      register: vm5_cleanup

    - name: Display VM5 cleanup result
      debug:
        msg: "{{ vm5_cleanup.stdout_lines }}"

# ============================================
# Final Summary
# ============================================
