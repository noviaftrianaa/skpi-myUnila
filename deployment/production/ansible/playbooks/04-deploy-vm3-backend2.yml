---
# Playbook 4: Deploy Backend Services 2 (Sister + Scheduler) to VM3
# Run: ansible-playbook -i inventory/hosts.yml playbooks/04-deploy-vm3-backend2.yml

- name: Deploy Backend Services 2 to VM3
  hosts: backend2
  become: yes
  gather_facts: yes

  vars:
    app_dir: "/var/www/my-unila"
    repo_url: "git@bitbucket.org:mahendraunila/my-unila.git"
    branch: "master"

  tasks:
    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
        accept_hostkey: yes
      become_user: "{{ ansible_user }}"

    - name: Check if .env file exists
      stat:
        path: "{{ app_dir }}/deployment/production/vm3-backend2/.env"
      register: env_file

    - name: Copy .env.example to .env if not exists
      copy:
        src: "{{ app_dir }}/deployment/production/vm3-backend2/.env.example"
        dest: "{{ app_dir }}/deployment/production/vm3-backend2/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        remote_src: yes
      when: not env_file.stat.exists

    - name: Pause for manual .env configuration
      pause:
        prompt: |

          ⚠️  IMPORTANT: Please edit .env file on VM3 before continuing!

          SSH to VM3: ssh {{ ansible_user }}@{{ ansible_host }}
          Edit file: nano {{ app_dir }}/deployment/production/vm3-backend2/.env

          Update these values:
          - Sister DB credentials (SISTER_DB_*)
          - APP_KEY for Laravel
          - JWT_SECRET
          - Meilisearch and Redis configuration

          Press ENTER when ready to continue...
      when: not env_file.stat.exists

    - name: Create Docker network
      docker_network:
        name: myunila-prod-network
        state: present

    - name: Allow Sister Service port 8083
      ufw:
        rule: allow
        port: '8083'
        proto: tcp

    - name: Build Sister Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm3-backend2
        docker compose -f services/sister/docker-compose.yml build --no-cache sister-service
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Sister Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm3-backend2
        docker compose -f services/sister/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for Sister Service to be healthy
      wait_for:
        host: localhost
        port: 8083
        delay: 10
        timeout: 60

    - name: Check services status
      shell: docker ps --filter "name=myunila" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: docker_status
      become_user: "{{ ansible_user }}"

    - name: Display services status
      debug:
        msg: "{{ docker_status.stdout_lines }}"
