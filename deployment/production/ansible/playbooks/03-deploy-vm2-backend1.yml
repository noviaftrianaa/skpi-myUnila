---
# Playbook 3: Deploy Backend Services 1 (Dashboard + Auth) to VM2
# Run: ansible-playbook -i inventory/hosts.yml playbooks/03-deploy-vm2-backend1.yml

- name: Deploy Backend Services to VM2
  hosts: backend1
  become: yes
  gather_facts: yes

  vars:
    app_dir: "/var/www/my-unila"
    repo_url: "git@bitbucket.org:mahendraunila/my-unila.git"
    branch: "master"

  tasks:
    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
        accept_hostkey: yes
      become_user: "{{ ansible_user }}"

    - name: Check if .env file exists
      stat:
        path: "{{ app_dir }}/deployment/production/vm2-backend1/.env"
      register: env_file

    - name: Copy .env.example to .env if not exists
      copy:
        src: "{{ app_dir }}/deployment/production/vm2-backend1/.env.example"
        dest: "{{ app_dir }}/deployment/production/vm2-backend1/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        remote_src: yes
      when: not env_file.stat.exists

    - name: Pause for manual .env configuration
      pause:
        prompt: |

          ⚠️  IMPORTANT: Please edit .env file on VM2 before continuing!

          SSH to VM2: ssh {{ ansible_user }}@{{ ansible_host }}
          Edit file: nano {{ app_dir }}/deployment/production/vm2-backend1/.env

          Update these values:
          - Database credentials (DB_MSSQL_*)
          - APP_KEY for Dashboard and Auth
          - JWT_SECRET
          - Meilisearch and Redis configuration

          Press ENTER when ready to continue...
      when: not env_file.stat.exists

    - name: Create Docker network
      docker_network:
        name: myunila-prod-network
        state: present

    - name: Allow Nginx port 8081 (Auth Service)
      ufw:
        rule: allow
        port: '8081'
        proto: tcp

    - name: Allow Nginx port 8082 (Dashboard Service)
      ufw:
        rule: allow
        port: '8082'
        proto: tcp

    - name: Build Public Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/public/docker-compose.yml build --no-cache public-service
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Build Auth Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/auth/docker-compose.yml build --no-cache auth-service
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Dashboard Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/dashboard/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Auth Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/auth/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Nginx
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/nginx/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for services to be healthy
      wait_for:
        host: localhost
        port: 8081
        delay: 10
        timeout: 60

    - name: Check services status
      shell: docker ps --filter "name=myunila" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
      register: docker_status
      become_user: "{{ ansible_user }}"

    - name: Display services status
      debug:
        msg: "{{ docker_status.stdout_lines }}"
