---
# Playbook 3: Deploy Backend Services 1 (Dashboard + Auth) to VM2
# Run: ansible-playbook -i inventory/hosts.yml playbooks/03-deploy-vm2-backend1.yml

- name: Deploy Backend Services to VM2
  hosts: backend1
  become: yes
  gather_facts: yes

  vars:
    app_dir: "/var/www/my-unila"
    repo_url: "https://bitbucket.org/mahendraunila/my-unila.git"
    branch: "master"

  tasks:
    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
      become_user: "{{ ansible_user }}"

    - name: Create .env file from template
      template:
        src: ../templates/vm2-env.j2
        dest: "{{ app_dir }}/deployment/production/vm2-backend1/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create Docker network
      docker_network:
        name: myunila-prod-network
        state: present

    - name: Allow Nginx port 8081 (Auth Service)
      ufw:
        rule: allow
        port: '8081'
        proto: tcp

    - name: Allow Nginx port 8082 (Dashboard Service)
      ufw:
        rule: allow
        port: '8082'
        proto: tcp

    - name: Build Dashboard Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/dashboard/docker-compose.yml build --no-cache dashboard-service
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Build Auth Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/auth/docker-compose.yml build --no-cache auth-service
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Dashboard Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/dashboard/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Auth Service
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/auth/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Start Nginx
      shell: |
        cd {{ app_dir }}/deployment/production/vm2-backend1
        docker compose -f services/nginx/docker-compose.yml up -d
      args:
        executable: /bin/bash
      become_user: "{{ ansible_user }}"

    - name: Wait for services to be healthy
      wait_for:
        host: localhost
        port: 8081
        delay: 10
        timeout: 60

    - name: Check services status
      shell: docker ps --filter "name=myunila" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: docker_status
      become_user: "{{ ansible_user }}"

    - name: Display services status
      debug:
        msg: "{{ docker_status.stdout_lines }}"
