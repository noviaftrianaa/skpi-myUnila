global:
  resolve_timeout: 5m

route:
  receiver: 'telegram'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: telegram
      repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'Markdown'
        message: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} *{{ .Status | toUpper }}* — {{ .GroupLabels.alertname }}{{ range .Alerts }}{{ "\n" }}• {{ .Annotations.summary }}{{ end }}{{ "\n" }}Environment: production'

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, vm]
