groups:
  - name: myunila.infra
    interval: 1m
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🔴 Target {{ $labels.job }} ({{ $labels.instance }}) DOWN"
          description: "Target telah down lebih dari 2 menit."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance,vm)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ CPU > 80% di VM {{ $labels.vm }} ({{ $labels.instance }})"
          description: "CPU usage {{ humanize $value }}% selama 5 menit."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Memory > 85% di VM {{ $labels.vm }} ({{ $labels.instance }})"
          description: "Memory usage {{ humanize $value }}%."

      - alert: DiskAlmostFull
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Disk > 80% di VM {{ $labels.vm }} ({{ $labels.mountpoint }})"
          description: "Disk usage {{ humanize $value }}%."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name=~"myunila-.*"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Container {{ $labels.name }} restart berkali-kali"
          description: "Container restart {{ $value }}x dalam 15 menit."

  - name: myunila.kong
    rules:
      - alert: KongHighErrorRate
        expr: |
          sum(rate(kong_http_requests_total{code=~"5.."}[5m])) by (service)
          /
          sum(rate(kong_http_requests_total[5m])) by (service)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "🔴 Kong error rate > 5% — service {{ $labels.service }}"

      - alert: KongHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(kong_request_latency_ms_bucket[5m])) by (le, service)
          ) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Kong P95 latency > 2s — service {{ $labels.service }}"

  - name: myunila.redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🔴 Redis DOWN di {{ $labels.instance }}"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Redis memory > 80%"
