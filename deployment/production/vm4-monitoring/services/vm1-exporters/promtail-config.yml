server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.120.44:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-vm1
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/myunila-.*'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
        replacement: '$1'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'vm'
        replacement: 'vm1'
      - target_label: 'environment'
        replacement: 'production'
    pipeline_stages:
      - docker: {}

  - job_name: system-vm1
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          vm: vm1
          environment: production
          __path__: /var/log/syslog
