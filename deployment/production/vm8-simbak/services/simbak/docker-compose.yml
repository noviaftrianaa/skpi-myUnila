version: '3.8'

services:
  simbak-service:
    build:
      context: ../../../../../backend/simbak-service
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    image: myunila/simbak-service:production
    container_name: myunila-simbak-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: "${APP_NAME:-SIMBAK Service}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL}"
      APP_TIMEZONE: "${TIMEZONE:-Asia/Jakarta}"

      # PostgreSQL (simbak — primary)
      DB_CONNECTION: pgsql
      DB_HOST: "${PG_HOST:-myunila-simbak-postgres}"
      DB_PORT: "${PG_PORT:-5432}"
      DB_DATABASE: "${PG_DATABASE:-simbak}"
      DB_USERNAME: "${PG_USERNAME:-myunila_bak}"
      DB_PASSWORD: "${PG_PASSWORD}"

      # SQL Server (pdut — read only)
      SQLSRV_HOST: "${SQLSRV_HOST:-192.168.123.119}"
      SQLSRV_PORT: "${SQLSRV_PORT:-1433}"
      SQLSRV_DATABASE: "${SQLSRV_DATABASE:-pdut}"
      SQLSRV_USERNAME: "${SQLSRV_USERNAME}"
      SQLSRV_PASSWORD: "${SQLSRV_PASSWORD}"
      SQLSRV_TRUST_SERVER_CERTIFICATE: "${SQLSRV_TRUST_SERVER_CERTIFICATE:-true}"

      # JWT (validation only)
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGO: "${JWT_ALGO:-HS256}"

      # Redis
      REDIS_HOST: "${REDIS_HOST:-myunila-simbak-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      CACHE_PREFIX: bak_
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # File Storage
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-simbak}"
      SIMBAK_STORAGE_PATH: "/data/simbak-storage"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:-myunila-storage}"

      # Logging
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      TZ: "${TIMEZONE:-Asia/Jakarta}"

    volumes:
      - simbak-storage:/data/simbak-storage
    depends_on:
      simbak-postgres:
        condition: service_healthy
      simbak-redis:
        condition: service_healthy
    networks:
      - simbak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=simbak,vm=vm8"

  # ============================================
  # Nginx reverse proxy → PHP-FPM
  # ============================================
  simbak-nginx:
    image: nginx:1.27-alpine
    container_name: myunila-simbak-nginx
    ports:
      - "9002:9002"
    volumes:
      - ../../configs/nginx/conf.d/simbak.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - simbak-service
    networks:
      - simbak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # PostgreSQL (simbak database — local)
  # ============================================
  simbak-postgres:
    image: postgres:16-alpine
    container_name: myunila-simbak-postgres
    environment:
      POSTGRES_DB: "${PG_DATABASE:-simbak}"
      POSTGRES_USER: "${PG_USERNAME:-myunila_bak}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TIMEZONE:-Asia/Jakarta}"
    volumes:
      - simbak-pg-data:/var/lib/postgresql/data
      - ../../../../../data-model/script/postgresql/simbak_v1.0_fresh.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../../../../data-model/script/postgresql/simbak-seed-staging.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5433:5432"
    networks:
      - simbak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-myunila_bak} -d ${PG_DATABASE:-simbak}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis (cache + queue + session)
  # ============================================
  simbak-redis:
    image: redis:7-alpine
    container_name: myunila-simbak-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - simbak-redis-data:/data
    ports:
      - "6380:6379"
    networks:
      - simbak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  simbak-pg-data:
    driver: local
  simbak-redis-data:
    driver: local
  simbak-storage:
    driver: local

networks:
  simbak-network:
    driver: bridge
    name: simbak-network
