version: '3.8'

services:
  si-kkn-service:
    build:
      context: ../../../../../backend/si-kkn-service
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    image: myunila/si-kkn-service:production
    container_name: myunila-si-kkn-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: "${SI_KKN_APP_NAME:-SI KKN Service}"
      APP_ENV: production
      APP_KEY: "${SI_KKN_APP_KEY}"
      APP_DEBUG: "${SI_KKN_APP_DEBUG:-false}"
      APP_URL: "${SI_KKN_APP_URL}"
      APP_TIMEZONE: "${TIMEZONE:-Asia/Jakarta}"

      # PostgreSQL (sikkn_myunila — primary, local container)
      DB_CONNECTION: pgsql
      DB_HOST: "${SI_KKN_PG_HOST:-myunila-si-kkn-postgres}"
      DB_PORT: "${SI_KKN_PG_PORT:-5432}"
      DB_DATABASE: "${SI_KKN_PG_DATABASE:-sikkn_myunila}"
      DB_USERNAME: "${SI_KKN_PG_USERNAME:-myunila_kkn}"
      DB_PASSWORD: "${SI_KKN_PG_PASSWORD}"

      # SQL Server (pdut — read only)
      SQLSRV_HOST: "${SQLSRV_HOST:-192.168.123.119}"
      SQLSRV_PORT: "${SQLSRV_PORT:-1433}"
      SQLSRV_DATABASE: "${SQLSRV_DATABASE:-pdut}"
      SQLSRV_USERNAME: "${SQLSRV_USERNAME}"
      SQLSRV_PASSWORD: "${SQLSRV_PASSWORD}"
      SQLSRV_TRUST_SERVER_CERTIFICATE: "${SQLSRV_TRUST_SERVER_CERTIFICATE:-true}"

      # JWT (validation only — token diterbitkan auth-service)
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGO: "${JWT_ALGO:-HS256}"

      # Redis (own container for SI KKN)
      REDIS_HOST: "${SI_KKN_REDIS_HOST:-myunila-si-kkn-redis}"
      REDIS_PORT: "${SI_KKN_REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${SI_KKN_REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      CACHE_PREFIX: kkn_
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # File Storage (default local; switch to MinIO via env)
      FILESYSTEM_DISK: "${SI_KKN_FILESYSTEM_DISK:-kkn}"
      KKN_STORAGE_PATH: "/data/si-kkn-storage"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:-myunila-storage}"

      # KKN WS API (legacy MySQL eKKN, optional)
      KKN_WS_API_BASE_URL: "${KKN_WS_API_BASE_URL:-}"
      KKN_WS_API_USERNAME: "${KKN_WS_API_USERNAME:-}"
      KKN_WS_API_PASSWORD: "${KKN_WS_API_PASSWORD:-}"

      # Logging
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      TZ: "${TIMEZONE:-Asia/Jakarta}"

    volumes:
      - si-kkn-storage:/data/si-kkn-storage
    depends_on:
      si-kkn-postgres:
        condition: service_healthy
      si-kkn-redis:
        condition: service_healthy
    networks:
      - si-kkn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Nginx (PHP-FPM proxy, listen 9004)
  # ============================================
  si-kkn-nginx:
    image: nginx:alpine
    container_name: myunila-si-kkn-nginx
    ports:
      - "9004:9004"
    volumes:
      - ../../configs/nginx/conf.d/si-kkn.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - si-kkn-storage:/data/si-kkn-storage:ro
    depends_on:
      - si-kkn-service
    networks:
      - si-kkn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # PostgreSQL (sikkn_myunila database — local)
  # ============================================
  si-kkn-postgres:
    image: postgres:16-alpine
    container_name: myunila-si-kkn-postgres
    environment:
      POSTGRES_DB: "${SI_KKN_PG_DATABASE:-sikkn_myunila}"
      POSTGRES_USER: "${SI_KKN_PG_USERNAME:-myunila_kkn}"
      POSTGRES_PASSWORD: "${SI_KKN_PG_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TIMEZONE:-Asia/Jakarta}"
    volumes:
      - si-kkn-pg-data:/var/lib/postgresql/data
      - ../../../../../data-model/script/postgresql/si-kkn-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5434:5432"
    networks:
      - si-kkn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SI_KKN_PG_USERNAME:-myunila_kkn} -d ${SI_KKN_PG_DATABASE:-sikkn_myunila}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis (cache + queue + session)
  # ============================================
  si-kkn-redis:
    image: redis:7-alpine
    container_name: myunila-si-kkn-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - si-kkn-redis-data:/data
    ports:
      - "6381:6379"
    networks:
      - si-kkn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  si-kkn-pg-data:
    driver: local
  si-kkn-redis-data:
    driver: local
  si-kkn-storage:
    driver: local

networks:
  si-kkn-network:
    driver: bridge
    name: si-kkn-network
