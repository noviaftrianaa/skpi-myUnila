server {
    listen 9006;
    server_name _;

    access_log /var/log/nginx/si-prestasi-access.log;
    error_log /var/log/nginx/si-prestasi-error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 180s;
    client_header_timeout 180s;
    send_timeout 180s;
    keepalive_timeout 65s;

    # Serve file public dari volume siprestasi-storage (mount-shared).
    # URL publik: http://host:9006/files/{kategori}/{id}/{filename}
    location /files/ {
        alias /data/siprestasi-storage/;
        autoindex off;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        access_log /var/log/nginx/si-prestasi-files.log;
    }

    location / {
        fastcgi_pass myunila-si-prestasi-service:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        fastcgi_connect_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_buffering on;
        fastcgi_request_buffering off;
    }

    location /api/health {
        fastcgi_pass myunila-si-prestasi-service:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI /api/health;
        access_log off;
    }
}
