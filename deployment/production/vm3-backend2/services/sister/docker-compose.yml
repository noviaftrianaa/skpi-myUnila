version: '3.8'

services:
  sister-service:
    build:
      context: ../../../../../backend/sister-service
      dockerfile: Dockerfile
    image: myunila/sister-service:production
    container_name: myunila-sister-service
    ports:
      - "8083:8083"
    environment:
      # App Configuration
      APP_NAME: ${SISTER_APP_NAME:-Sister Service}
      APP_PORT: ${SISTER_APP_PORT:-:8083}
      APP_ENV: ${SISTER_APP_ENV:-production}

      # Database Configuration
      DB_DRIVER: ${SISTER_DB_DRIVER:-sqlserver}
      DB_HOST: ${SISTER_DB_HOST}
      DB_PORT: ${SISTER_DB_PORT:-1433}
      DB_USERNAME: ${SISTER_DB_USERNAME}
      DB_PASSWORD: ${SISTER_DB_PASSWORD}
      DB_DATABASE: ${SISTER_DB_DATABASE}
      # Database connection pool - Optimized for 8 CPU / 16GB RAM
      DB_MAX_OPEN_CONNS: ${SISTER_DB_MAX_OPEN_CONNS:-100}
      DB_MAX_IDLE_CONNS: ${SISTER_DB_MAX_IDLE_CONNS:-20}
      DB_CONN_MAX_LIFETIME: ${SISTER_DB_CONN_MAX_LIFETIME:-5m}
      # Go runtime settings
      GOMAXPROCS: 8
      GOGC: 100

      # SISTER API Configuration
      SISTER_API_BASE_URL: ${SISTER_API_BASE_URL}
      SISTER_API_IDPENGGUNA: ${SISTER_API_IDPENGGUNA}
      SISTER_API_USERNAME: ${SISTER_API_USERNAME}
      SISTER_API_PASSWORD: ${SISTER_API_PASSWORD}

      # Encryption Key
      API_CONFIG_ENCRYPTION_KEY: ${API_CONFIG_ENCRYPTION_KEY}

      # Laravel APP_KEY for decrypting encrypted IDs from public-service
      LARAVEL_APP_KEY: ${LARAVEL_APP_KEY}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Timezone
      TZ: ${TZ:-Asia/Jakarta}

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          cpus: '4'
          memory: 4G

    networks:
      - myunila-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=sister,vm=vm3"

networks:
  myunila-prod-network:
    external: true
    name: myunila-prod-network
