version: '3.8'

services:
  sister-service:
    build:
      context: ../../../../../backend/sister-service
      dockerfile: docker/Dockerfile
      args:
        - APP_ENV=production
    image: myunila/sister-service:production
    container_name: myunila-sister-service
    restart: unless-stopped
    working_dir: /var/www/html

    environment:
      # Laravel
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: "${APP_URL}"

      # Database
      DB_CONNECTION: "${SISTER_DB_CONNECTION}"
      DB_HOST: "${SISTER_DB_HOST}"
      DB_PORT: "${SISTER_DB_PORT}"
      DB_DATABASE: "${SISTER_DB_DATABASE}"
      DB_USERNAME: "${SISTER_DB_USERNAME}"
      DB_PASSWORD: "${SISTER_DB_PASSWORD}"

      # Meilisearch
      MEILISEARCH_HOST: "${MEILISEARCH_HOST}"
      MEILISEARCH_KEY: "${MEILISEARCH_KEY}"

      # Redis
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

      # JWT
      JWT_SECRET: "${JWT_SECRET}"
      JWT_TTL: "${JWT_TTL}"

      # Logging
      LOG_CHANNEL: "${LOG_CHANNEL}"
      LOG_LEVEL: "${LOG_LEVEL}"

      # Service URLs
      KONG_ADMIN_URL: "${KONG_ADMIN_URL}"
      KONG_PROXY_URL: "${KONG_PROXY_URL}"

    ports:
      - "${SISTER_SERVICE_PORT}:9000"

    networks:
      - myunila-prod-network

    volumes:
      - sister-storage:/var/www/html/storage
      - sister-logs:/var/www/html/storage/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - sister-nginx

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sister-nginx:
    image: nginx:alpine
    container_name: myunila-sister-nginx
    restart: unless-stopped

    ports:
      - "8083:80"

    volumes:
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../configs/nginx/conf.d/sister.conf:/etc/nginx/conf.d/default.conf:ro
      - sister-logs:/var/log/nginx

    networks:
      - myunila-prod-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-prod-network:
    external: true

volumes:
  sister-storage:
    driver: local
  sister-logs:
    driver: local
