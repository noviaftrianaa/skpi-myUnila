server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running requests
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Buffer settings
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Proxy settings
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # Logging
    access_log /var/log/nginx/sister-access.log;
    error_log /var/log/nginx/sister-error.log;

    # Proxy to Sister Service
    location / {
        proxy_pass http://myunila-sister-service:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://myunila-sister-service:9000/api/health;
        access_log off;
    }
}
