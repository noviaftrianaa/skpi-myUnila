# =============================================
# blog.unila.ac.id (apex) + *.blog.unila.ac.id (tenant)
# =============================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name blog.unila.ac.id *.blog.unila.ac.id api.blog.unila.ac.id;
    return 301 https://$host$request_uri;
}

# Default deny untuk hostname tidak dikenali
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# =============================================
# HTTPS — frontend-blog (apex + tenant)
# =============================================
server {
    listen 443 ssl http2;
    server_name blog.unila.ac.id *.blog.unila.ac.id;

    ssl_certificate     /etc/nginx/ssl/blog.unila.ac.id.crt;
    ssl_certificate_key /etc/nginx/ssl/blog.unila.ac.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # =============================================
    # Security headers (Sprint 13 hardening)
    # =============================================
    # HSTS: 1 tahun, preload-eligible. Submit ke https://hstspreload.org
    # setelah verify semua subdomain enforce HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP — Content Security Policy. Whitelist origin yang frontend butuh:
    #   img-src     : MinIO (cover/avatar upload), ui-avatars (fallback), picsum (mock),
    #                 unsplash (test images), data:/blob: untuk OG generator + paste image
    #   script-src  : 'unsafe-inline' wajib utk Next.js hydration script + JSON-LD;
    #                 'unsafe-eval' diperlukan untuk Next dev only — boleh di-strip
    #                 di production build kalau tidak pakai fitur dev runtime
    #   style-src   : 'unsafe-inline' wajib utk Tailwind utility inline + TipTap inline styles
    #   connect-src : API blog-service + WS untuk Next.js hot-reload (dev)
    #   frame-src   : YouTube embed (Phase MVP), Twitter/X embed (P2)
    #   frame-ancestors 'self': prevent click-jacking dari domain lain
    #   form-action 'self': prevent form hijack ke external endpoint
    #   object-src 'none': block Flash/applet legacy attack vectors
    #   upgrade-insecure-requests: force HTTP→HTTPS untuk semua subresource
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://minio.unila.ac.id https://ui-avatars.com https://picsum.photos https://images.unsplash.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.blog.unila.ac.id wss: ws:; media-src 'self' https://minio.unila.ac.id; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://platform.twitter.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # MIME sniffing protection — block browser dari nebak MIME type
    add_header X-Content-Type-Options nosniff always;

    # Click-jacking — only embed di same-origin (overridden oleh CSP frame-ancestors
    # di browser modern, tapi tetap kirim utk legacy)
    add_header X-Frame-Options SAMEORIGIN always;

    # Referrer policy: kirim path saja di same-origin, origin-only di cross-origin HTTPS
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Disable feature browser yang tidak dipakai (camera, mic, geo)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # COOP/COEP — opt-in untuk SharedArrayBuffer kalau nanti perlu (saat ini tidak)
    # add_header Cross-Origin-Opener-Policy same-origin always;
    # add_header Cross-Origin-Embedder-Policy require-corp always;

    # Static asset cache (1 year, immutable)
    location /_next/static/ {
        proxy_pass http://frontend_blog;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /favicon.ico {
        proxy_pass http://frontend_blog;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location /robots.txt {
        proxy_pass http://frontend_blog;
        expires 1d;
    }

    # Sitemap & RSS
    location ~ ^/(sitemap\.xml|sitemap-.*\.xml|feed\.xml) {
        proxy_pass http://frontend_blog;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # API health (frontend internal)
    location /api/health {
        proxy_pass http://frontend_blog;
        access_log off;
    }

    # All other → Next.js SSR (with hostname pass-through for middleware routing)
    location / {
        proxy_pass http://frontend_blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }
}

# =============================================
# HTTPS — api.blog.unila.ac.id (blog-service, port 8091)
# Sprint 13: backend Go ready, server block enabled.
# CORS dihandle di Go (fiber CORS middleware); nginx hanya tambah security headers.
# =============================================
server {
    listen 443 ssl http2;
    server_name api.blog.unila.ac.id;

    ssl_certificate     /etc/nginx/ssl/blog.unila.ac.id.crt;
    ssl_certificate_key /etc/nginx/ssl/blog.unila.ac.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers — API serves JSON only, CSP super ketat.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    # API tidak meng-embed apapun + tidak boleh di-embed.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy no-referrer always;

    # Body limit untuk media upload (Phase AJ-AK).
    client_max_body_size 25M;

    location / {
        proxy_pass http://blog_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        # Timeout konfig untuk long-running operations (search reindex, etc).
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # OG image generator (Phase AL) — cache aggressive di Nginx untuk reduce load Go.
    location /api/v1/og {
        proxy_pass http://blog_service;
        proxy_cache_valid 200 1d;
        proxy_cache_valid any 5m;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Healthcheck — no log noise dari Kong/uptime probe.
    location = /api/v1/health {
        proxy_pass http://blog_service;
        access_log off;
    }
}

# =============================================
# Health check internal
# =============================================
server {
    listen 80;
    server_name localhost;
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
