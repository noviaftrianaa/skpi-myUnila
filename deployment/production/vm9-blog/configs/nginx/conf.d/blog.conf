# =============================================
# blog.unila.ac.id (apex) + *.blog.unila.ac.id (tenant)
# =============================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name blog.unila.ac.id *.blog.unila.ac.id api.blog.unila.ac.id;
    return 301 https://$host$request_uri;
}

# Default deny untuk hostname tidak dikenali
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# =============================================
# HTTPS — frontend-blog (apex + tenant)
# =============================================
server {
    listen 443 ssl http2;
    server_name blog.unila.ac.id *.blog.unila.ac.id;

    ssl_certificate     /etc/nginx/ssl/blog.unila.ac.id.crt;
    ssl_certificate_key /etc/nginx/ssl/blog.unila.ac.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static asset cache (1 year, immutable)
    location /_next/static/ {
        proxy_pass http://frontend_blog;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /favicon.ico {
        proxy_pass http://frontend_blog;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location /robots.txt {
        proxy_pass http://frontend_blog;
        expires 1d;
    }

    # Sitemap & RSS
    location ~ ^/(sitemap\.xml|sitemap-.*\.xml|feed\.xml) {
        proxy_pass http://frontend_blog;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # API health (frontend internal)
    location /api/health {
        proxy_pass http://frontend_blog;
        access_log off;
    }

    # All other → Next.js SSR (with hostname pass-through for middleware routing)
    location / {
        proxy_pass http://frontend_blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }
}

