  #     TZ: ${TZ:-Asia/Jakarta}
  #   ports:
  #     - "127.0.0.1:8091:8091"
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8091/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   networks: [blog-net]

  frontend-blog:
    build:
      context: ../../../frontend-blog
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BLOG_API: ${NEXT_PUBLIC_BLOG_API}
        NEXT_PUBLIC_APEX_HOST: ${NEXT_PUBLIC_APEX_HOST}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK}
        NEXT_PUBLIC_MEILI_HOST: ${MEILI_HOST}
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY}
    image: myunila-frontend-blog:latest
    container_name: myunila-frontend-blog
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [blog-net]

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    depends_on:
      - frontend-blog
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      - blog_nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
    networks: [blog-net]

volumes:
  blog_postgres_data:
  blog_redis_data:
  blog_nginx_logs:

networks:
  blog-net:
    driver: bridge
