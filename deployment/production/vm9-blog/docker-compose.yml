# ============================================
# vm9-blog (192.168.120.49) — Blog Platform
# Stack: PostgreSQL 16 + Redis + Go blog-service + Next.js frontend-blog + Nginx
# ============================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_unila
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
      # Auto-init schema on first run
      - ../../../data-model/script/postgresql/blog:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog_user", "-d", "blog_unila"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blog-net]

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - blog_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [blog-net]

  # NOTE: blog-service di-comment dulu — backend Go scaffolding belum dibuat.
