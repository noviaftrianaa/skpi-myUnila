server {
    listen 81;
    server_name _;

    # Logging
    access_log /var/log/nginx/public-service-access.log;
    error_log /var/log/nginx/public-service-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client settings for large uploads and slow connections
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 180s;
    client_header_timeout 180s;
    send_timeout 180s;
    keepalive_timeout 65s;

    # Pass all requests to PHP-FPM (no need for try_files since nginx doesn't have access to files)
    location / {
        fastcgi_pass myunila-public-service:9000;
        fastcgi_index index.php;

        # Always use index.php as the script
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # Pass request info to PHP-FPM
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        # FastCGI timeout settings (optimized for slow SQL queries)
        fastcgi_connect_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        # FastCGI buffer settings (optimized for large JSON responses)
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Enable buffering for better performance
        fastcgi_buffering on;
        fastcgi_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
