services:
  myunila-service:
    container_name: myunila-integrator-service
    build:
      context: ../../../../../backend/myunila-service
      dockerfile: Dockerfile
    image: myunila/myunila-service:production
    env_file:
      - ../../.env
    environment:
      - APP_NAME=MyUnila Service
      - APP_PORT=:8086
      - APP_ENV=${APP_ENV:-production}
      - DB_DRIVER=sqlserver
      - DB_HOST=${MYUNILA_DB_HOST:-${DB_HOST}}
      - DB_PORT=${MYUNILA_DB_PORT:-1433}
      - DB_DATABASE=${MYUNILA_DB_DATABASE:-pdut}
      - DB_USERNAME=${MYUNILA_DB_USERNAME:-${DB_USERNAME}}
      - DB_PASSWORD=${MYUNILA_DB_PASSWORD:-${DB_PASSWORD}}
      - DB_TRUST_SERVER_CERTIFICATE=true
      - SIKEP_API_BASE_URL=${SIKEP_API_BASE_URL:-https://sikep.unila.ac.id/api/v1}
      - SIKEP_API_USERNAME=${SIKEP_API_USERNAME}
      - SIKEP_API_PASSWORD=${SIKEP_API_PASSWORD}
      - TZ=${TIMEZONE:-Asia/Jakarta}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - myunila-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=myunila,vm=vm2"

networks:
  myunila-prod-network:
    external: true
    name: myunila-prod-network
