version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: myunila-redis-vm2
    env_file:
      - ../../.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - myunila-prod-network
    command: redis-server --appendonly yes --maxmemory 800mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass} ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis,vm=vm2"

networks:
  myunila-prod-network:
    external: true
    name: myunila-prod-network

volumes:
  redis_data:
    driver: local
    name: myunila-redis-data-vm2
