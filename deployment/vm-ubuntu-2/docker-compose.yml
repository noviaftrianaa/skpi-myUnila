version: '3.8'

services:
  # ============================================================================
  # Redis (Cache, Session, Queue)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  # ============================================================================
  # Auth Service (Laravel 11)
  # ============================================================================
  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - APP_NAME="MyUnila Auth Service"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${LARAVEL_AUTH_APP_KEY}
      - APP_URL=${APP_URL}

      # Database
      - DB_CONNECTION=sqlsrv
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_TTL=60

      # Session
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
    ports:
      - "8081:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Dashboard Service (Laravel 11)
  # ============================================================================
  dashboard-service:
    build:
      context: ../../backend/dashboard-service
      dockerfile: Dockerfile
    container_name: dashboard-service
    environment:
      - APP_NAME="MyUnila Dashboard Service"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${LARAVEL_DASHBOARD_APP_KEY}
      - APP_URL=${APP_URL}

      # Database
      - DB_CONNECTION=sqlsrv
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Session
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
    ports:
      - "8082:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Sister Service (Go 1.22 + Fiber)
  # ============================================================================
  sister-service:
    build:
      context: ../../backend/sister-service
      dockerfile: Dockerfile
    container_name: sister-service
    environment:
      - APP_ENV=production
      - APP_PORT=8083

      # Database
      - DB_DRIVER=sqlserver
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # SISTER API Configuration
      - SISTER_API_BASE_URL=${SISTER_API_BASE_URL}
      - SISTER_API_IDPENGGUNA=${SISTER_API_IDPENGGUNA}
      - SISTER_API_USERNAME=${SISTER_API_USERNAME}
      - SISTER_API_PASSWORD=${SISTER_API_PASSWORD}

      # Encryption
      - API_CONFIG_ENCRYPTION_KEY=${API_CONFIG_ENCRYPTION_KEY}
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M

  # ============================================================================
  # Nginx (Reverse Proxy)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - dashboard-service
      - sister-service
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M

  # ============================================================================
  # Redis Exporter (Prometheus)
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

  # ============================================================================
  # Node Exporter (Prometheus)
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-vm2
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  # ============================================================================
  # Nginx Prometheus Exporter
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-vm2
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

volumes:
  redis_data:
    driver: local

networks:
  backend-network:
    driver: bridge
