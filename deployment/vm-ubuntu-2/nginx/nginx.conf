# ============================================================================
# NGINX CONFIGURATION - VM UBUNTU 2 (Backend Services)
# ============================================================================
# Purpose: Reverse proxy for Laravel backend services (Auth, Dashboard)
#          Direct access for Go Sister Service
# Version: 1.0
# Last Updated: 2025-10-29
# ============================================================================

# Run as nginx user (for security)
user nginx;

# Auto-detect number of CPU cores for optimal performance
worker_processes auto;

# Error log location and level
error_log /var/log/nginx/error.log warn;

# PID file location
pid /var/run/nginx.pid;

# ============================================================================
# EVENTS BLOCK - Connection Processing
# ============================================================================
events {
    # Maximum number of simultaneous connections per worker
    worker_connections 2048;

    # Use epoll for better performance on Linux
    use epoll;

    # Accept multiple connections at once
    multi_accept on;
}

# ============================================================================
# HTTP BLOCK - Main Configuration
# ============================================================================
http {
    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------------------------------------------
    # LOGGING CONFIGURATION
    # ----------------------------------------------------------------------------
    # Custom log format with detailed information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Access log with timing information
    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------------------------
    # PERFORMANCE SETTINGS
    # ----------------------------------------------------------------------------
    # Enable sendfile for efficient file transfers
    sendfile on;

    # Send headers in one piece (optimize packet sending)
    tcp_nopush on;

    # Don't buffer data-sends (disable Nagle's algorithm)
    tcp_nodelay on;

    # Timeout for keep-alive connections
    keepalive_timeout 65;

    # Timeout for client body reads
    client_body_timeout 60s;

    # Timeout for client header reads
    client_header_timeout 60s;

    # Timeout for transmitting a response to the client
    send_timeout 60s;

    # Maximum size of the types hash table
    types_hash_max_size 2048;

    # Maximum allowed size of client request body (20MB for file uploads)
    client_max_body_size 20M;

    # Buffer size for reading client request body
    client_body_buffer_size 128k;

    # Maximum number and size of buffers for large client headers
    large_client_header_buffers 4 16k;

    # ----------------------------------------------------------------------------
    # BUFFER SETTINGS (for PHP-FPM)
    # ----------------------------------------------------------------------------
    # These settings optimize communication with PHP-FPM

    # Size of buffer for reading the first part of response from FastCGI
    fastcgi_buffer_size 128k;

    # Number and size of buffers for reading response from FastCGI
    fastcgi_buffers 256 16k;

    # Limit on total size of buffers for reading response from FastCGI
    fastcgi_busy_buffers_size 256k;

    # Timeout for establishing connection with FastCGI server
    fastcgi_connect_timeout 60s;

    # Timeout for transmitting request to FastCGI server
    fastcgi_send_timeout 300s;

    # Timeout for reading response from FastCGI server
    fastcgi_read_timeout 300s;

    # ----------------------------------------------------------------------------
    # PROXY SETTINGS
    # ----------------------------------------------------------------------------
    # Buffer size for reading the first part of response from proxied server
    proxy_buffer_size 128k;

    # Number and size of buffers for reading response from proxied server
    proxy_buffers 8 128k;

    # Limit on total size of buffers for reading response from proxied server
    proxy_busy_buffers_size 256k;

    # ----------------------------------------------------------------------------
    # GZIP COMPRESSION
    # ----------------------------------------------------------------------------
    # Enable gzip compression
    gzip on;

    # Add Vary: Accept-Encoding header
    gzip_vary on;

    # Minimum length of response to compress (1KB)
    gzip_min_length 1024;

    # Compression level (1-9, 6 is good balance)
    gzip_comp_level 6;

    # Enable compression for proxied requests
    gzip_proxied any;

    # MIME types to compress
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom_xml;

    # Disable gzip for IE6
    gzip_disable "msie6";

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------------------------------
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection in browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------------------------
    # RATE LIMITING ZONES
    # ----------------------------------------------------------------------------
    # Limit requests to prevent abuse

    # Rate limit for Auth Service (50 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/s;

    # Rate limit for Dashboard Service (100 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=100r/s;

    # Rate limit for Sister Service (30 req/sec per IP - external API)
    limit_req_zone $binary_remote_addr zone=sister_limit:10m rate=30r/s;

    # Rate limit for login attempts (5 req/min per IP)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # HTTP status code to return when rate limit is exceeded
    limit_req_status 429;

    # ----------------------------------------------------------------------------
    # CONNECTION LIMITING
    # ----------------------------------------------------------------------------
    # Limit number of concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP status code to return when connection limit is exceeded
    limit_conn_status 429;

    # ----------------------------------------------------------------------------
    # UPSTREAM DEFINITIONS (for Load Balancing - Future Use)
    # ----------------------------------------------------------------------------
    # These can be used if you scale to multiple backend instances

    # upstream auth_backend {
    #     least_conn;  # Use least connections algorithm
    #     server auth-service:9000 max_fails=3 fail_timeout=30s;
    #     # server auth-service-2:9000 max_fails=3 fail_timeout=30s;
    # }

    # upstream dashboard_backend {
    #     least_conn;
    #     server dashboard-service:9000 max_fails=3 fail_timeout=30s;
    #     # server dashboard-service-2:9000 max_fails=3 fail_timeout=30s;
    # }

    # ----------------------------------------------------------------------------
    # CACHE SETTINGS (for static assets)
    # ----------------------------------------------------------------------------
    # Define cache path and parameters
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
    #                  max_size=100m inactive=60m use_temp_path=off;

    # ----------------------------------------------------------------------------
    # REAL IP CONFIGURATION (if behind proxy/load balancer)
    # ----------------------------------------------------------------------------
    # Uncomment if Nginx is behind another proxy/load balancer
    # set_real_ip_from 192.168.1.10;  # VM Ubuntu 1 (Kong Gateway)
    # set_real_ip_from 172.16.0.0/12; # Docker network
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ----------------------------------------------------------------------------
    # SERVER TOKENS (Security)
    # ----------------------------------------------------------------------------
    # Hide Nginx version in error pages and response headers
    server_tokens off;

    # ----------------------------------------------------------------------------
    # INCLUDE SERVER BLOCKS
    # ----------------------------------------------------------------------------
    # Load all server configurations from conf.d directory
    include /etc/nginx/conf.d/*.conf;
}

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
#
# 1. PHP-FPM Integration:
#    - Laravel services use PHP-FPM running on port 9000 inside containers
#    - FastCGI settings optimized for Laravel's requirements
#    - Increased timeouts for long-running operations
#
# 2. Performance Tuning:
#    - worker_processes auto: Matches CPU core count
#    - worker_connections 2048: Handles up to ~16K concurrent connections (8 cores)
#    - Gzip compression enabled for text-based responses
#    - Sendfile enabled for efficient static file serving
#
# 3. Security Features:
#    - Rate limiting prevents brute force and DDoS attacks
#    - Security headers prevent common web vulnerabilities
#    - server_tokens off hides Nginx version
#    - Large buffers prevent buffer overflow attacks
#
# 4. Monitoring:
#    - Detailed logging includes upstream response times
#    - Nginx status endpoint available for Prometheus scraping
#    - Health check endpoints for load balancer integration
#
# 5. Scalability:
#    - Upstream blocks prepared for horizontal scaling
#    - Connection pooling to backend services
#    - Cache configuration ready for static asset caching
#
# ============================================================================
# MAINTENANCE COMMANDS
# ============================================================================
#
# Test configuration:
#   docker exec nginx-backend nginx -t
#
# Reload configuration (zero downtime):
#   docker exec nginx-backend nginx -s reload
#
# View error logs:
#   docker exec nginx-backend tail -f /var/log/nginx/error.log
#
# View access logs:
#   docker exec nginx-backend tail -f /var/log/nginx/access.log
#
# Check Nginx status:
#   curl http://localhost:8080/nginx_status
#
# ============================================================================
