# ============================================================================
# BACKEND SERVICES CONFIGURATION - VM UBUNTU 2
# ============================================================================
# Auth Service (Laravel + PHP-FPM) - Port 8081
# Dashboard Service (Laravel + PHP-FPM) - Port 8082
# Sister Service (Go + Fiber) - Port 8083 (direct, no Nginx proxy needed)
# ============================================================================

# ============================================================================
# AUTH SERVICE (Laravel 11 + PHP-FPM) - Port 8081
# ============================================================================
server {
    listen 8081;
    server_name _;

    # Document root (Laravel public directory)
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Character set
    charset utf-8;

    # Logging
    access_log /var/log/nginx/auth-service-access.log;
    error_log /var/log/nginx/auth-service-error.log;

    # ----------------------------------------------------------------------------
    # MAIN LOCATION BLOCK - Laravel Front Controller
    # ----------------------------------------------------------------------------
    location / {
        # Try to serve file directly, fallback to index.php
        try_files $uri $uri/ /index.php?$query_string;

        # Rate limiting (allow burst for normal operations)
        limit_req zone=auth_limit burst=20 nodelay;

        # Connection limiting (max 10 concurrent connections per IP)
        limit_conn conn_limit 10;
    }

    # ----------------------------------------------------------------------------
    # PHP-FPM CONFIGURATION
    # ----------------------------------------------------------------------------
    location ~ \.php$ {
        # Prevent processing of non-existent files
        try_files $uri =404;

        # FastCGI parameters
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass auth-service:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Include standard FastCGI parameters
        include fastcgi_params;

        # Additional FastCGI parameters for Laravel
        fastcgi_param PHP_VALUE "upload_max_filesize=20M \n post_max_size=20M";
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Timeouts (increased for long-running operations)
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffering settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;

        # Rate limiting for PHP requests
        limit_req zone=auth_limit burst=15 nodelay;
    }

    # ----------------------------------------------------------------------------
    # LOGIN ENDPOINT - STRICT RATE LIMITING
    # ----------------------------------------------------------------------------
    location ~ ^/api/v1/(login|auth|token) {
        try_files $uri /index.php?$query_string;

        # Strict rate limiting for authentication endpoints
        limit_req zone=login_limit burst=3 nodelay;

        # Pass to PHP-FPM
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass auth-service:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        try_files $uri /index.php?$query_string;

        fastcgi_pass auth-service:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # ----------------------------------------------------------------------------
    # DENY ACCESS TO SENSITIVE FILES
    # ----------------------------------------------------------------------------
    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Deny access to .env file
    location ~ /\.env {
        deny all;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to vendor directory
    location ~ ^/(vendor|storage|bootstrap/cache) {
        deny all;
    }

    # ----------------------------------------------------------------------------
    # STATIC ASSETS CACHING
    # ----------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS (specific to Auth Service)
    # ----------------------------------------------------------------------------
    add_header X-Service-Name "Auth Service" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================================================
# DASHBOARD SERVICE (Laravel 11 + PHP-FPM) - Port 8082
# ============================================================================
server {
    listen 8082;
    server_name _;

    # Document root (Laravel public directory)
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Character set
    charset utf-8;

    # Logging
    access_log /var/log/nginx/dashboard-service-access.log;
    error_log /var/log/nginx/dashboard-service-error.log;

    # ----------------------------------------------------------------------------
    # MAIN LOCATION BLOCK - Laravel Front Controller
    # ----------------------------------------------------------------------------
    location / {
        # Try to serve file directly, fallback to index.php
        try_files $uri $uri/ /index.php?$query_string;

        # Rate limiting
        limit_req zone=dashboard_limit burst=30 nodelay;

        # Connection limiting
        limit_conn conn_limit 15;
    }

    # ----------------------------------------------------------------------------
    # PHP-FPM CONFIGURATION
    # ----------------------------------------------------------------------------
    location ~ \.php$ {
        # Prevent processing of non-existent files
        try_files $uri =404;

        # FastCGI parameters
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass dashboard-service:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Include standard FastCGI parameters
        include fastcgi_params;

        # Additional FastCGI parameters for Laravel
        fastcgi_param PHP_VALUE "upload_max_filesize=20M \n post_max_size=20M";
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffering settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;

        # Rate limiting
        limit_req zone=dashboard_limit burst=20 nodelay;
    }

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        try_files $uri /index.php?$query_string;

        fastcgi_pass dashboard-service:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # ----------------------------------------------------------------------------
    # API ENDPOINTS (Dashboard API)
    # ----------------------------------------------------------------------------
    location ~ ^/api/ {
        try_files $uri /index.php?$query_string;

        fastcgi_pass dashboard-service:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;

        # CORS headers (if needed for frontend integration)
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ----------------------------------------------------------------------------
    # DENY ACCESS TO SENSITIVE FILES
    # ----------------------------------------------------------------------------
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(vendor|storage|bootstrap/cache) {
        deny all;
    }

    # ----------------------------------------------------------------------------
    # STATIC ASSETS CACHING
    # ----------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------------------------------
    add_header X-Service-Name "Dashboard Service" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================================================
# INTERNAL PROXY (Port 80) - Optional Load Balancer Health Check
# ============================================================================
server {
    listen 80 default_server;
    server_name _;

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "Backend services healthy\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------------------------
    # NGINX STATUS (for Prometheus monitoring)
    # ----------------------------------------------------------------------------
    location /nginx_status {
        stub_status on;
        access_log off;

        # Allow only from internal Docker network and monitoring server
        allow 172.16.0.0/12;  # Docker network
        allow 127.0.0.1;      # Localhost
        allow 192.168.1.12;   # Windows Server 1 (Prometheus)
        deny all;
    }

    # ----------------------------------------------------------------------------
    # SERVICE STATUS PAGE (for debugging)
    # ----------------------------------------------------------------------------
    location /services {
        access_log off;
        default_type application/json;

        # Allow only from internal network
        allow 172.16.0.0/12;
        allow 192.168.1.0/24;
        deny all;

        return 200 '{"services":[{"name":"auth","port":8081,"status":"up"},{"name":"dashboard","port":8082,"status":"up"},{"name":"sister","port":8083,"status":"up","note":"Direct access, no proxy"}],"timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Redirect all other requests to specific service
    location / {
        return 404 "Service not found. Use port 8081 (Auth), 8082 (Dashboard), or 8083 (Sister)\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
#
# 1. Sister Service (Port 8083):
#    - Runs as standalone Go application (Fiber framework)
#    - Does NOT use Nginx proxy
#    - Accessed directly via port 8083
#    - Has built-in routing and middleware
#    - Configured in docker-compose.yml to expose port 8083
#
# 2. PHP-FPM Communication:
#    - Laravel services use PHP-FPM on port 9000
#    - FastCGI protocol for communication
#    - Separate PHP-FPM pool per service (best practice)
#    - Socket communication would be faster but requires shared volumes
#
# 3. Rate Limiting Strategy:
#    - Auth Service: 50 req/s (stricter for security)
#    - Dashboard Service: 100 req/s (more lenient for dashboards)
#    - Login endpoints: 5 req/min (prevent brute force)
#    - Sister Service: Handled by Go application itself
#
# 4. Security Measures:
#    - Deny access to sensitive files (.env, vendor, etc.)
#    - Hide PHP version in headers
#    - Rate limiting on all endpoints
#    - CORS headers properly configured
#    - Security headers (X-Frame-Options, etc.)
#
# 5. Performance Optimization:
#    - Static assets cached for 1 year
#    - Gzip compression (from nginx.conf)
#    - FastCGI buffering optimized for Laravel
#    - Connection pooling to PHP-FPM
#
# 6. Monitoring Integration:
#    - /nginx_status endpoint for Prometheus
#    - /health endpoints for health checks
#    - Detailed access logs with timing information
#    - /services endpoint for service discovery
#
# 7. Laravel Specific Optimizations:
#    - try_files directive for front controller pattern
#    - Proper handling of .php files
#    - Environment variable passing to PHP-FPM
#    - Upload size limits (20MB)
#
# ============================================================================
# TESTING COMMANDS
# ============================================================================
#
# Test Auth Service:
#   curl http://localhost:8081/health
#   curl -X POST http://localhost:8081/api/v1/login \
#     -H "Content-Type: application/json" \
#     -d '{"email":"test@example.com","password":"password"}'
#
# Test Dashboard Service:
#   curl http://localhost:8082/health
#   curl http://localhost:8082/api/v1/dashboard
#
# Test Sister Service (direct, not through Nginx):
#   curl http://localhost:8083/health
#   curl http://localhost:8083/public/monitoring/active
#
# Test Nginx status:
#   curl http://localhost:8080/nginx_status
#
# Test rate limiting:
#   for i in {1..60}; do curl http://localhost:8081/health; done
#   # Should see 429 errors after limit reached
#
# Check PHP-FPM status (from inside container):
#   docker exec auth-service php-fpm -t
#   docker exec dashboard-service php-fpm -t
#
# View Nginx error logs:
#   docker exec nginx-backend tail -f /var/log/nginx/error.log
#   docker exec nginx-backend tail -f /var/log/nginx/auth-service-error.log
#   docker exec nginx-backend tail -f /var/log/nginx/dashboard-service-error.log
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Issue: 502 Bad Gateway
# Cause: PHP-FPM not responding or wrong fastcgi_pass address
# Solution:
#   - Check PHP-FPM is running: docker ps | grep auth-service
#   - Check PHP-FPM logs: docker logs auth-service
#   - Verify service name in docker-compose.yml matches fastcgi_pass
#   - Test connectivity: docker exec nginx-backend ping auth-service
#
# Issue: 504 Gateway Timeout
# Cause: PHP script taking too long to execute
# Solution:
#   - Check PHP execution time limits
#   - Increase fastcgi_read_timeout in this config
#   - Optimize slow Laravel queries/operations
#   - Check database connectivity
#
# Issue: 413 Request Entity Too Large
# Cause: Upload size exceeds client_max_body_size
# Solution:
#   - Increase client_max_body_size in nginx.conf
#   - Also check PHP upload_max_filesize and post_max_size
#   - Restart Nginx: docker exec nginx-backend nginx -s reload
#
# Issue: 429 Too Many Requests
# Cause: Rate limit exceeded
# Solution:
#   - This is expected behavior for rate limiting
#   - Adjust limit_req_zone rate if too restrictive
#   - Increase burst parameter if needed
#   - Check if legitimate traffic or attack
#
# Issue: Static files not loading
# Cause: Incorrect root path or permissions
# Solution:
#   - Verify root path matches Laravel public directory
#   - Check file permissions in container
#   - Check Docker volume mounts in docker-compose.yml
#   - Test direct access: curl http://localhost:8081/favicon.ico
#
# ============================================================================
