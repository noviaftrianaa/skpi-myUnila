version: '3.8'

services:
  frontend:
    build:
      context: ../../../../frontend
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL}
        NEXT_PUBLIC_SISTER_API_URL: ${NEXT_PUBLIC_SISTER_API_URL}
    image: myunila/frontend:latest
    container_name: myunila-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
      NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL}
      NEXT_PUBLIC_SISTER_API_URL: ${NEXT_PUBLIC_SISTER_API_URL}
      TZ: ${TZ:-Asia/Jakarta}
    networks:
      - myunila-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=frontend"

networks:
  myunila-network:
    external: true
    name: myunila-network
