version: '3.8'

services:
  # Kong Database Migration (Run once)
  kong-migration:
    image: kong:3.4-alpine
    container_name: myunila-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_secure_password_2024}
    networks:
      - myunila-network
    restart: on-failure
    depends_on:
      - postgres-kong-check
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Health check for PostgreSQL (wait for it to be ready)
  postgres-kong-check:
    image: postgres:15-alpine
    container_name: myunila-postgres-check
    command: >
      sh -c "
      until pg_isready -h postgres-kong -U ${KONG_PG_USER:-kong}; do
        echo 'Waiting for PostgreSQL...';
        sleep 2;
      done;
      echo 'PostgreSQL is ready!';
      "
    networks:
      - myunila-network
    environment:
      PGPASSWORD: ${KONG_PG_PASSWORD:-kong_secure_password_2024}
    restart: "no"

  # Kong Gateway
  kong:
    image: kong:3.4-alpine
    container_name: myunila-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_secure_password_2024}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "${KONG_PROXY_PORT:-9800}:8000"   # HTTP Proxy
      - "9843:8443"                        # HTTPS Proxy
      - "${KONG_ADMIN_PORT:-9801}:8001"   # Admin API
      - "9844:8444"                        # Admin API HTTPS
    networks:
      - myunila-network
    depends_on:
      - kong-migration
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Kong UI - Simple dashboard
  kong-ui:
    image: nginx:alpine
    container_name: myunila-kong-ui
    ports:
      - "${KONG_UI_PORT:-9803}:80"
    volumes:
      - ../../configs/kong/ui:/usr/share/nginx/html:ro
    networks:
      - myunila-network
    depends_on:
      - kong
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-network:
    external: true
    name: myunila-network
