version: '3.8'

services:
  # Kong Database Migration (Run once)
  kong-migration:
    image: kong:3.4
    container_name: myunila-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: 192.168.123.172
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_secure_password_2024}
    networks:
      - myunila-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Kong Gateway
  kong:
    image: kong:3.4
    container_name: myunila-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: 192.168.123.172
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_secure_password_2024}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      # Increase timeouts for slow queries
      KONG_UPSTREAM_CONNECT_TIMEOUT: 180000   # 3 minutes
      KONG_UPSTREAM_SEND_TIMEOUT: 180000      # 3 minutes
      KONG_UPSTREAM_READ_TIMEOUT: 180000      # 3 minutes
    ports:
      - "${KONG_PROXY_PORT:-9800}:8000"   # HTTP Proxy
      - "9843:8443"                        # HTTPS Proxy
      - "${KONG_ADMIN_PORT:-9801}:8001"   # Admin API
      - "9844:8444"                        # Admin API HTTPS
    networks:
      - myunila-network
    depends_on:
      - kong-migration
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Kong UI - Simple dashboard
  kong-ui:
    image: nginx:alpine
    container_name: myunila-kong-ui
    ports:
      - "${KONG_UI_PORT:-9803}:80"
    volumes:
      - ../../configs/kong/ui:/usr/share/nginx/html:ro
    networks:
      - myunila-network
    depends_on:
      - kong
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myunila-network:
    external: true
    name: myunila-network
