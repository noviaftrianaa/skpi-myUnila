global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'myunila-testing-vm1'
    environment: 'testing'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vm1-host'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vm1-containers'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'myunila-redis'

  # Kong Gateway (if metrics plugin enabled)
  # - job_name: 'kong'
  #   static_configs:
  #     - targets: ['kong:8001']
  #   metrics_path: '/metrics'

  # Sister Service - Go metrics (if exposed)
  # - job_name: 'sister-service'
  #   static_configs:
  #     - targets: ['sister-service:8083']
  #   metrics_path: '/metrics'
