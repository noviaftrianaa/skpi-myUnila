server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/auth-service-access.log;
    error_log /var/log/nginx/auth-service-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Pass all requests to PHP-FPM (no need for try_files since nginx doesn't have access to files)
    location / {
        fastcgi_pass myunila-auth-service:9000;
        fastcgi_index index.php;

        # Always use index.php as the script
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # Pass request info to PHP-FPM
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
