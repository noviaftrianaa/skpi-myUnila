# ============================================================================
# SYNC SERVICES CONFIGURATION - VM UBUNTU 3
# ============================================================================
# Sister Service (Go + Fiber) - Port 8083
# PDDIKTI Feeder Service (Go + Fiber) - Port 8084
# Health check endpoints and monitoring
# ============================================================================

# ============================================================================
# SISTER SERVICE (Go + Fiber) - Port 8083
# ============================================================================
server {
    listen 8083;
    server_name _;

    # Character set
    charset utf-8;

    # Logging
    access_log /var/log/nginx/sister-service-access.log;
    error_log /var/log/nginx/sister-service-error.log;

    # ----------------------------------------------------------------------------
    # MAIN LOCATION BLOCK - Proxy to Sister Service
    # ----------------------------------------------------------------------------
    location / {
        # Proxy to Go application
        proxy_pass http://sister-service:8083;

        # Rate limiting (allow burst for normal operations)
        limit_req zone=sister_limit burst=10 nodelay;

        # Connection limiting (max 10 concurrent connections per IP)
        limit_conn conn_limit 10;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (increased for long-running sync operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;

        # HTTP version for upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------------------------
    # SYNC ENDPOINTS - STRICT RATE LIMITING
    # ----------------------------------------------------------------------------
    location ~ ^/(api/v1/sync|api/v1/dosen/sync|api/v1/mahasiswa/sync) {
        # Proxy to Go application
        proxy_pass http://sister-service:8083;

        # Strict rate limiting for sync operations (prevent abuse)
        limit_req zone=sync_limit burst=2 nodelay;

        # Increased timeout for long-running operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 900s;  # 15 minutes for sync operations

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering off;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://sister-service:8083/health;

        # Fast timeout for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ----------------------------------------------------------------------------
    # MONITORING ENDPOINT
    # ----------------------------------------------------------------------------
    location /public/monitoring {
        access_log off;
        proxy_pass http://sister-service:8083/public/monitoring;

        # Allow only from monitoring servers
        allow 172.16.0.0/12;  # Docker network
        allow 192.168.1.12;   # Windows Server 1 (Prometheus)
        deny all;
    }

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS (specific to Sister Service)
    # ----------------------------------------------------------------------------
    add_header X-Service-Name "Sister Service" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================================================
# PDDIKTI FEEDER SERVICE (Go + Fiber) - Port 8084
# ============================================================================
server {
    listen 8084;
    server_name _;

    # Character set
    charset utf-8;

    # Logging
    access_log /var/log/nginx/feeder-service-access.log;
    error_log /var/log/nginx/feeder-service-error.log;

    # ----------------------------------------------------------------------------
    # MAIN LOCATION BLOCK - Proxy to Feeder Service
    # ----------------------------------------------------------------------------
    location / {
        # Proxy to Go application
        proxy_pass http://feeder-service:8084;

        # Rate limiting
        limit_req zone=feeder_limit burst=10 nodelay;

        # Connection limiting
        limit_conn conn_limit 10;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (increased for PDDIKTI API operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------------------------
    # UPLOAD ENDPOINTS - STRICT RATE LIMITING
    # ----------------------------------------------------------------------------
    location ~ ^/(api/v1/upload|api/v1/dosen/upload|api/v1/mahasiswa/upload) {
        # Proxy to Go application
        proxy_pass http://feeder-service:8084;

        # Strict rate limiting for upload operations
        limit_req zone=sync_limit burst=2 nodelay;

        # Increased timeout for long-running operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 900s;  # 15 minutes for upload operations

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering off;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://feeder-service:8084/health;

        # Fast timeout for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ----------------------------------------------------------------------------
    # MONITORING ENDPOINT
    # ----------------------------------------------------------------------------
    location /public/monitoring {
        access_log off;
        proxy_pass http://feeder-service:8084/public/monitoring;

        # Allow only from monitoring servers
        allow 172.16.0.0/12;  # Docker network
        allow 192.168.1.12;   # Windows Server 1 (Prometheus)
        deny all;
    }

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------------------------------
    add_header X-Service-Name "PDDIKTI Feeder Service" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# ============================================================================
# INTERNAL PROXY (Port 80) - Load Balancer Health Check
# ============================================================================
server {
    listen 80 default_server;
    server_name _;

    # ----------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "Sync services healthy\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------------------------
    # NGINX STATUS (for Prometheus monitoring)
    # ----------------------------------------------------------------------------
    location /nginx_status {
        stub_status on;
        access_log off;

        # Allow only from internal Docker network and monitoring server
        allow 172.16.0.0/12;  # Docker network
        allow 127.0.0.1;      # Localhost
        allow 192.168.1.12;   # Windows Server 1 (Prometheus)
        deny all;
    }

    # ----------------------------------------------------------------------------
    # SERVICE STATUS PAGE (for debugging)
    # ----------------------------------------------------------------------------
    location /services {
        access_log off;
        default_type application/json;

        # Allow only from internal network
        allow 172.16.0.0/12;
        allow 192.168.1.0/24;
        deny all;

        return 200 '{"services":[{"name":"sister","port":8083,"status":"up","type":"SISTER API Integration"},{"name":"feeder","port":8084,"status":"up","type":"PDDIKTI Feeder"}],"timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Redirect all other requests to specific service
    location / {
        return 404 "Service not found. Use port 8083 (Sister) or 8084 (Feeder)\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
#
# 1. Sister Service (Port 8083):
#    - SISTER API Integration (Go + Fiber)
#    - Sync operations for Dosen, Mahasiswa
#    - Direct proxy to Go application
#    - Long timeout for sync operations (15 minutes)
#
# 2. PDDIKTI Feeder Service (Port 8084):
#    - Neo Feeder Integration (Go + Fiber)
#    - Upload operations to PDDIKTI database
#    - Data validation before upload
#    - Long timeout for upload operations (15 minutes)
#
# 3. Rate Limiting Strategy:
#    - Sister Service: 30 req/s (external API calls)
#    - Feeder Service: 20 req/s (external API calls)
#    - Sync/Upload operations: 5 req/min (heavy operations)
#    - Prevents API abuse and overload
#
# 4. Security Measures:
#    - Rate limiting on all endpoints
#    - Connection limiting per IP
#    - Monitoring endpoints restricted to internal network
#    - Security headers (X-Frame-Options, etc.)
#
# 5. Performance Optimization:
#    - Gzip compression (from nginx.conf)
#    - Proxy buffering for normal requests
#    - No buffering for streaming sync/upload operations
#    - Connection keep-alive for upstream
#
# 6. Monitoring Integration:
#    - /nginx_status endpoint for Prometheus
#    - /health endpoints for health checks
#    - Detailed access logs with timing information
#    - /services endpoint for service discovery
#
# 7. Timeout Configuration:
#    - Normal operations: 10 minutes
#    - Sync operations: 15 minutes
#    - Health checks: 5 seconds
#    - Appropriate for long-running external API calls
#
# ============================================================================
# TESTING COMMANDS
# ============================================================================
#
# Test Sister Service:
#   curl http://localhost:8083/health
#   curl http://localhost:8083/api/v1/dosen
#   curl -X POST http://localhost:8083/api/v1/dosen/sync
#
# Test Feeder Service:
#   curl http://localhost:8084/health
#   curl http://localhost:8084/api/v1/dosen
#   curl -X POST http://localhost:8084/api/v1/dosen/upload
#
# Test Nginx status:
#   curl http://localhost:8080/nginx_status
#
# Test rate limiting:
#   for i in {1..40}; do curl http://localhost:8083/health; done
#   # Should see 429 errors after limit reached
#
# View Nginx error logs:
#   docker exec nginx-sync tail -f /var/log/nginx/error.log
#   docker exec nginx-sync tail -f /var/log/nginx/sister-service-error.log
#   docker exec nginx-sync tail -f /var/log/nginx/feeder-service-error.log
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Issue: 502 Bad Gateway
# Cause: Go service not responding or wrong proxy_pass address
# Solution:
#   - Check service is running: docker ps | grep sister-service
#   - Check service logs: docker logs sister-service
#   - Verify service name in docker-compose.yml matches proxy_pass
#   - Test connectivity: docker exec nginx-sync ping sister-service
#
# Issue: 504 Gateway Timeout
# Cause: Sync operation taking too long
# Solution:
#   - Check sync operation progress in service logs
#   - Increase proxy_read_timeout if needed
#   - Verify external API (SISTER/PDDIKTI) is responding
#   - Check database connectivity
#
# Issue: 429 Too Many Requests
# Cause: Rate limit exceeded
# Solution:
#   - This is expected behavior for rate limiting
#   - Adjust limit_req_zone rate if too restrictive
#   - Increase burst parameter if needed
#   - Check if legitimate traffic or abuse
#
# Issue: Sync operations fail
# Cause: External API timeout or credentials
# Solution:
#   - Check SISTER API credentials in .env
#   - Verify PDDIKTI Feeder credentials
#   - Test external API connectivity
#   - Check Redis connection for queue
#
# ============================================================================
