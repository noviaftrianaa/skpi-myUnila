# ============================================================================
# NGINX CONFIGURATION - VM UBUNTU 3 (Sync Services)
# ============================================================================
# Purpose: Reverse proxy for sync services (Sister, PDDIKTI Feeder)
#          Health check endpoints and monitoring integration
# Version: 1.0
# Last Updated: 2025-10-30
# ============================================================================

# Run as nginx user (for security)
user nginx;

# Auto-detect number of CPU cores for optimal performance
worker_processes auto;

# Error log location and level
error_log /var/log/nginx/error.log warn;

# PID file location
pid /var/run/nginx.pid;

# ============================================================================
# EVENTS BLOCK - Connection Processing
# ============================================================================
events {
    # Maximum number of simultaneous connections per worker
    worker_connections 2048;

    # Use epoll for better performance on Linux
    use epoll;

    # Accept multiple connections at once
    multi_accept on;
}

# ============================================================================
# HTTP BLOCK - Main Configuration
# ============================================================================
http {
    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------------------------------------------
    # LOGGING CONFIGURATION
    # ----------------------------------------------------------------------------
    # Custom log format with detailed information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Access log with timing information
    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------------------------
    # PERFORMANCE SETTINGS
    # ----------------------------------------------------------------------------
    # Enable sendfile for efficient file transfers
    sendfile on;

    # Send headers in one piece (optimize packet sending)
    tcp_nopush on;

    # Don't buffer data-sends (disable Nagle's algorithm)
    tcp_nodelay on;

    # Timeout for keep-alive connections
    keepalive_timeout 65;

    # Timeout for client body reads
    client_body_timeout 60s;

    # Timeout for client header reads
    client_header_timeout 60s;

    # Timeout for transmitting a response to the client
    send_timeout 60s;

    # Maximum size of the types hash table
    types_hash_max_size 2048;

    # Maximum allowed size of client request body (10MB for API requests)
    client_max_body_size 10M;

    # Buffer size for reading client request body
    client_body_buffer_size 128k;

    # Maximum number and size of buffers for large client headers
    large_client_header_buffers 4 16k;

    # ----------------------------------------------------------------------------
    # PROXY SETTINGS (for Go services)
    # ----------------------------------------------------------------------------
    # Buffer size for reading the first part of response from proxied server
    proxy_buffer_size 128k;

    # Number and size of buffers for reading response from proxied server
    proxy_buffers 8 128k;

    # Limit on total size of buffers for reading response from proxied server
    proxy_busy_buffers_size 256k;

    # Timeout for establishing connection with proxied server
    proxy_connect_timeout 60s;

    # Timeout for transmitting request to proxied server
    proxy_send_timeout 300s;

    # Timeout for reading response from proxied server (increased for sync operations)
    proxy_read_timeout 600s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ----------------------------------------------------------------------------
    # GZIP COMPRESSION
    # ----------------------------------------------------------------------------
    # Enable gzip compression
    gzip on;

    # Add Vary: Accept-Encoding header
    gzip_vary on;

    # Minimum length of response to compress (1KB)
    gzip_min_length 1024;

    # Compression level (1-9, 6 is good balance)
    gzip_comp_level 6;

    # Enable compression for proxied requests
    gzip_proxied any;

    # MIME types to compress
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom_xml;

    # Disable gzip for IE6
    gzip_disable "msie6";

    # ----------------------------------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------------------------------
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection in browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------------------------
    # RATE LIMITING ZONES
    # ----------------------------------------------------------------------------
    # Limit requests to prevent abuse

    # Rate limit for Sister Service (30 req/sec per IP - external API)
    limit_req_zone $binary_remote_addr zone=sister_limit:10m rate=30r/s;

    # Rate limit for Feeder Service (20 req/sec per IP - external API)
    limit_req_zone $binary_remote_addr zone=feeder_limit:10m rate=20r/s;

    # Rate limit for sync operations (5 req/min per IP - heavy operations)
    limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=5r/m;

    # HTTP status code to return when rate limit is exceeded
    limit_req_status 429;

    # ----------------------------------------------------------------------------
    # CONNECTION LIMITING
    # ----------------------------------------------------------------------------
    # Limit number of concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP status code to return when connection limit is exceeded
    limit_conn_status 429;

    # ----------------------------------------------------------------------------
    # UPSTREAM DEFINITIONS (for Load Balancing - Future Use)
    # ----------------------------------------------------------------------------
    # These can be used if you scale to multiple service instances

    # upstream sister_backend {
    #     least_conn;  # Use least connections algorithm
    #     server sister-service:8083 max_fails=3 fail_timeout=30s;
    #     # server sister-service-2:8083 max_fails=3 fail_timeout=30s;
    # }

    # upstream feeder_backend {
    #     least_conn;
    #     server feeder-service:8084 max_fails=3 fail_timeout=30s;
    #     # server feeder-service-2:8084 max_fails=3 fail_timeout=30s;
    # }

    # ----------------------------------------------------------------------------
    # CACHE SETTINGS (for API responses)
    # ----------------------------------------------------------------------------
    # Define cache path and parameters
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
    #                  max_size=100m inactive=60m use_temp_path=off;

    # ----------------------------------------------------------------------------
    # REAL IP CONFIGURATION (if behind proxy/load balancer)
    # ----------------------------------------------------------------------------
    # Uncomment if Nginx is behind another proxy/load balancer
    # set_real_ip_from 192.168.1.10;  # VM Ubuntu 1 (Kong Gateway)
    # set_real_ip_from 172.16.0.0/12; # Docker network
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ----------------------------------------------------------------------------
    # SERVER TOKENS (Security)
    # ----------------------------------------------------------------------------
    # Hide Nginx version in error pages and response headers
    server_tokens off;

    # ----------------------------------------------------------------------------
    # INCLUDE SERVER BLOCKS
    # ----------------------------------------------------------------------------
    # Load all server configurations from conf.d directory
    include /etc/nginx/conf.d/*.conf;
}

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
#
# 1. Sync Services Integration:
#    - Sister Service: Go + Fiber (port 8083)
#    - PDDIKTI Feeder Service: Go + Fiber (port 8084)
#    - Both are standalone Go applications
#    - Proxy configuration optimized for long-running sync operations
#
# 2. Performance Tuning:
#    - worker_processes auto: Matches CPU core count
#    - worker_connections 2048: Handles up to ~16K concurrent connections (8 cores)
#    - Gzip compression enabled for JSON responses
#    - Increased proxy_read_timeout for long sync operations
#
# 3. Security Features:
#    - Rate limiting prevents API abuse
#    - Security headers prevent common web vulnerabilities
#    - server_tokens off hides Nginx version
#    - Connection limiting per IP
#
# 4. Monitoring:
#    - Detailed logging includes upstream response times
#    - Nginx status endpoint available for Prometheus scraping
#    - Health check endpoints for load balancer integration
#
# 5. Scalability:
#    - Upstream blocks prepared for horizontal scaling
#    - Connection pooling to backend services
#    - Cache configuration ready for API response caching
#
# ============================================================================
# MAINTENANCE COMMANDS
# ============================================================================
#
# Test configuration:
#   docker exec nginx-sync nginx -t
#
# Reload configuration (zero downtime):
#   docker exec nginx-sync nginx -s reload
#
# View error logs:
#   docker exec nginx-sync tail -f /var/log/nginx/error.log
#
# View access logs:
#   docker exec nginx-sync tail -f /var/log/nginx/access.log
#
# Check Nginx status:
#   curl http://localhost:8080/nginx_status
#
# ============================================================================
